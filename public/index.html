<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><script src="https://telegram.org/js/telegram-web-app.js"></script>
</head><body>
<title>PlayVault</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* === TOKENS ===
   Layout: fixed bottom nav, scrollable main, bottom-sheet overlays
   Dark-first (Steam-style dark UI) */
:root {
  --bg: #0e1117;
  --sf: #161b27;
  --sf2: #1e2535;
  --sf3: #252e42;
  --ink: #e2e8f4;
  --sub: #8b9ab8;
  --brd: #2a3448;
  --ac: #5ba3d9;
  --ac2: #4090c8;
  --ok: #5cb87a;
  --warn: #e8a84a;
  --hot: #e05c5c;
  --acink: #fff;
  color-scheme: dark;
}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f0f4f9;--sf:#fff;--sf2:#e8edf5;--sf3:#dde3ed;
  --ink:#1a2235;--sub:#5a6a85;--brd:#d0d8e8;
  --ac:#1a6fad;--ac2:#1560980;--ok:#1e8a46;--warn:#b06010;--hot:#c03030;--acink:#fff;
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#f0f4f9;--sf:#fff;--sf2:#e8edf5;--sf3:#dde3ed;
  --ink:#1a2235;--sub:#5a6a85;--brd:#d0d8e8;
  --ac:#1a6fad;--ac2:#156098;--ok:#1e8a46;--warn:#b06010;--hot:#c03030;--acink:#fff;
  color-scheme:light;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font:400 15px/1.5 Inter,system-ui,sans-serif;
  background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;
  padding:0 0 env(safe-area-inset-bottom,0px);
  overflow-x:hidden;
}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,textarea{font:inherit;color:inherit}
img{max-width:100%;display:block}
a{color:var(--ac)}

/* ── Layout ── */
#app{display:flex;flex-direction:column;max-width:440px;margin:0 auto;min-height:100%;position:relative}
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px 10px;
  padding-top:calc(12px + env(safe-area-inset-top,0px));
  background:var(--bg);
  position:sticky;top:0;z-index:10;
  border-bottom:1px solid var(--brd);
}
.logo{font-weight:800;font-size:19px;letter-spacing:-.03em;color:var(--ink)}
.logo span{color:var(--ac)}
#balchip{
  display:flex;align-items:center;gap:6px;
  background:var(--sf2);border:1px solid var(--brd);
  border-radius:20px;padding:6px 12px;
  font-weight:700;font-size:13px;cursor:pointer;
  transition:background .15s;
}
#balchip:hover{background:var(--sf3)}
#balchip::before{content:"₽";opacity:.6;font-size:11px}
main{flex:1;padding:12px 16px 90px;display:flex;flex-direction:column;gap:10px}
nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:440px;
  background:var(--sf);border-top:1px solid var(--brd);
  display:grid;grid-template-columns:repeat(3,1fr);
  padding-bottom:env(safe-area-inset-bottom,0px);
  z-index:10;
}
nav button{
  background:none;border:0;padding:10px 0 8px;
  color:var(--sub);font-weight:600;font-size:11px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  transition:color .15s;position:relative;
}
nav button.on{color:var(--ac)}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[data-n]::after{
  content:attr(data-n);position:absolute;top:5px;left:calc(50% + 8px);
  min-width:16px;height:16px;border-radius:9px;
  background:var(--hot);color:#fff;font-size:10px;font-weight:800;
  display:flex;align-items:center;justify-content:center;padding:0 3px;
}

/* ── Type ── */
h2{font-size:18px;font-weight:800;letter-spacing:-.02em}
h3{font-size:15px;font-weight:700}
.mut{color:var(--sub);font-size:13px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px}
.sec-head h2{font-size:17px}

/* ── Cards ── */
.card{background:var(--sf);border:1px solid var(--brd);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card.lead{background:linear-gradient(135deg,#1e3a5f,#12263d);border-color:rgba(91,163,217,.3)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}

/* ── Buttons ── */
.btn{
  height:48px;border-radius:13px;font-weight:700;font-size:15px;
  padding:0 18px;display:flex;align-items:center;justify-content:center;gap:8px;
  transition:opacity .15s,transform .1s;width:100%;
}
.btn:active{opacity:.85;transform:scale(.98)}
.btn.pri{background:var(--ac);color:#fff}
.btn.sec{background:var(--sf2);color:var(--ink);border:1px solid var(--brd)}
.btn.sm{height:36px;font-size:13px;border-radius:10px;width:auto;padding:0 14px}
.btn:disabled{opacity:.5;pointer-events:none}
.back{color:var(--ac);font-weight:600;font-size:14px;padding:4px 0;align-self:flex-start;display:flex;align-items:center;gap:4px}
.back::before{content:"←"}

/* ── Search ── */
.search-wrap{position:relative}
.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--sub);fill:none;stroke-width:2;stroke-linecap:round}
.search{
  width:100%;height:46px;padding:0 16px 0 42px;
  border-radius:13px;border:1px solid var(--brd);
  background:var(--sf);color:var(--ink);
  font-size:15px;font-size:max(15px,16px);
  transition:border-color .15s;
}
.search:focus{outline:none;border-color:var(--ac)}

/* ── Pack rows ── */
.pack{
  display:grid;grid-template-columns:64px 1fr auto;
  gap:12px;align-items:center;
  background:var(--sf);border:1px solid var(--brd);
  border-radius:16px;padding:12px 14px;
  text-align:left;width:100%;
  transition:background .15s;
}
.pack:hover,.pack:focus-visible{background:var(--sf2)}
.cover{
  width:64px;height:64px;border-radius:12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#fff;overflow:hidden;position:relative;flex-shrink:0;
}
.cover b{font-size:22px;font-weight:800;line-height:1;position:relative;z-index:1}
.cover span{font-size:10px;font-weight:600;opacity:.85;margin-top:3px;position:relative;z-index:1}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pack .nm{font-weight:800;font-size:15px;line-height:1.2}
.pack .sub{font-size:12px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price-col{text-align:right;flex-shrink:0}
.price{font-weight:800;font-size:16px;white-space:nowrap}
.old-price{text-decoration:line-through;color:var(--sub);font-size:12px}
.disc-badge{
  display:inline-block;background:var(--hot);color:#fff;
  font-size:11px;font-weight:800;padding:2px 6px;border-radius:6px;
}

/* ── Tags ── */
.tag{font-size:12px;font-weight:600;padding:3px 9px;border-radius:8px;background:var(--sf2);color:var(--sub);display:inline-block}
.tag.ok{background:rgba(92,184,122,.15);color:var(--ok)}
.tag.warn{background:rgba(232,168,74,.15);color:var(--warn)}
.tag.hot{background:rgba(224,92,92,.15);color:var(--hot)}

/* ── Bar ── */
.bar{height:5px;border-radius:9px;background:var(--sf2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);border-radius:9px}

/* ── Hero banner ── */
.hero{
  border-radius:18px;padding:22px 20px;
  background:linear-gradient(130deg,#1a3a60 0%,#0e1e38 60%,#111827 100%);
  position:relative;overflow:hidden;
}
.hero::before{
  content:"";position:absolute;right:-40px;top:-40px;
  width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle,rgba(91,163,217,.18),transparent 70%);
}
.hero h2{font-size:22px;line-height:1.2;color:#fff;position:relative}
.hero p{color:rgba(255,255,255,.7);font-size:14px;margin-top:6px;position:relative}
.hero-stats{display:flex;gap:8px;margin-top:12px;position:relative;flex-wrap:wrap}
.hero-stats span{
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);
  border-radius:9px;padding:6px 11px;font-size:13px;font-weight:600;color:#fff;
}
.hero-actions{display:flex;gap:8px;margin-top:14px;position:relative;flex-wrap:wrap}

/* ── Savings badge ── */
.savings{
  background:rgba(92,184,122,.15);border:1px solid rgba(92,184,122,.25);
  border-radius:10px;padding:10px 14px;
  display:flex;align-items:center;gap:10px;
}
.savings .big{font-size:18px;font-weight:800;color:var(--ok)}

/* ── Horizontal scroll cards ── */
.hs-wrap{margin:0 -16px;padding:0 16px}
.hs{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x mandatory;padding-bottom:4px}
.hs::-webkit-scrollbar{display:none}
.gt{
  flex:none;width:110px;height:152px;border-radius:14px;
  padding:10px;display:flex;flex-direction:column;justify-content:flex-end;
  color:#fff;text-align:left;border:0;position:relative;overflow:hidden;
  scroll-snap-align:start;transition:transform .15s;
  cursor:pointer;
}
.gt:hover{transform:scale(1.04)}
.gt::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,rgba(0,0,0,.75));z-index:1}
.gt i{position:absolute;top:4px;left:8px;font:800 52px/1 Inter,sans-serif;font-style:normal;opacity:.18}
.gt .gl{position:relative;z-index:2;font-size:12px;font-weight:700;line-height:1.25}
.gt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}

/* ── Rec card ── */
.rec{background:var(--sf);border:1px solid var(--brd);border-radius:18px;overflow:hidden}
.rec-img{aspect-ratio:460/215;position:relative;overflow:hidden;cursor:pointer}
.rec-img>span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:800 72px Inter,sans-serif;color:rgba(255,255,255,.2);z-index:0}
.rec-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.rec-img::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.5),transparent 50%);z-index:2}
.rbadge{position:absolute;top:12px;left:12px;background:rgba(10,14,22,.7);backdrop-filter:blur(4px);color:#fff;font-size:12px;font-weight:700;padding:5px 10px;border-radius:8px;z-index:3}
.rbadge.disc{left:auto;right:12px;background:var(--hot);color:#fff}
.rec-body{padding:16px;display:flex;flex-direction:column;gap:12px}

/* ── Detail page ── */
.pack-hero{border-radius:16px;overflow:hidden;position:relative;min-height:96px;display:flex;align-items:center;padding:18px}
.pack-hero .t{display:flex;flex-direction:column;gap:4px;color:#fff}
.pack-hero .t b{font-size:44px;font-weight:800;line-height:1;letter-spacing:-.04em}
.pack-hero .t span{font-size:13px;font-weight:600;opacity:.85}
.stk{display:flex;margin-left:auto}
.stk i{width:46px;height:46px;border-radius:12px;border:2px solid rgba(255,255,255,.5);margin-left:-12px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;font:800 20px Inter,sans-serif;font-style:normal;color:#fff}
.stk i:first-child{margin-left:0}
.stk i img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* ── Game list ── */
.glist{max-height:min(340px,40vh);overflow:auto;border:1px solid var(--brd);border-radius:13px}
.glist-item{
  padding:10px 14px;border-bottom:1px solid var(--brd);
  display:flex;align-items:center;gap:10px;
  font-size:14px;
}
.glist-item:last-child{border:0}
.glist-item img{width:44px;height:20px;border-radius:4px;object-fit:cover;flex-shrink:0}
.gname-btn{
  background:none;border:0;padding:0;text-align:left;color:var(--ink);
  font:inherit;cursor:pointer;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:14px;
}
.gname-btn:hover{color:var(--ac);text-decoration:underline;text-underline-offset:2px}
.fav{font-size:16px;padding:4px 6px;flex-shrink:0;opacity:.5;transition:opacity .15s,color .15s}
.fav:hover,.fav.on{opacity:1}
.fav.on{color:#e05c5c}

/* ── Credentials ── */
.cred{background:var(--sf2);border:1px solid var(--brd);border-radius:11px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.cred small{display:block;color:var(--sub);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.cred code{font:700 15px ui-monospace,Menlo,monospace;word-break:break-all}
.ico{color:var(--ac);font-weight:600;font-size:13px;padding:6px;border-radius:8px;transition:background .15s}
.ico:hover{background:var(--sf3)}
.code-display{
  font:800 30px ui-monospace,Menlo,monospace;
  letter-spacing:.2em;text-align:center;
  padding:16px;background:var(--sf2);border-radius:11px;
}

/* ── Sheet ── */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:20;backdrop-filter:blur(2px)}
.sheet.open{display:flex}
.sheet>div{
  background:var(--sf);width:100%;max-width:440px;
  border-radius:22px 22px 0 0;
  padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:12px;
  max-height:88vh;overflow:auto;
}
.sheet-handle{width:36px;height:4px;background:var(--brd);border-radius:2px;margin:0 auto -4px}
.opt{
  display:flex;justify-content:space-between;align-items:center;
  width:100%;background:var(--sf2);border:1.5px solid transparent;
  border-radius:13px;padding:14px;font-weight:600;text-align:left;
  transition:border-color .15s;
}
.opt.on{border-color:var(--ac)}
.sum{display:flex;justify-content:space-between;font-size:14px}
.sum.total{font-weight:800;font-size:17px}
.promo-row{display:flex;gap:8px}
.promo-row input{
  flex:1;height:42px;padding:0 14px;border-radius:11px;
  border:1px solid var(--brd);background:var(--sf2);
  color:var(--ink);text-transform:uppercase;font:inherit;
}

/* ── Game info sheet ── */
.gcv{width:100%;aspect-ratio:16/7;border-radius:14px;overflow:hidden;position:relative;flex-shrink:0}
.gcv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gcv::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.55),transparent 50%)}
.gcv-title{position:absolute;bottom:12px;left:14px;right:14px;color:#fff;font-size:18px;font-weight:800;line-height:1.2;z-index:1}
.gbadge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:8px;background:rgba(91,163,217,.15);color:var(--ac);border:1px solid rgba(91,163,217,.25)}

/* ── Search results ── */
.results{border:1px solid var(--brd);border-radius:13px;overflow:hidden}
.result-item{
  padding:10px 14px;border-bottom:1px solid var(--brd);
  display:flex;align-items:center;gap:10px;font-size:14px;cursor:default;
}
.result-item:last-child{border:0}
.pack-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.pack-ref{display:flex;align-items:center;gap:6px;color:var(--sub);font-size:12px;flex-shrink:0;cursor:pointer}
.pack-ref:hover{color:var(--ac)}

/* ── How it works ── */
.how{display:flex;flex-direction:column}
.hw{display:grid;grid-template-columns:40px 1fr;gap:14px;position:relative;padding-bottom:20px}
.hw:last-child{padding-bottom:0}
.hw:not(:last-child)::before{content:"";position:absolute;left:19px;top:44px;bottom:4px;width:2px;background:linear-gradient(var(--ac),var(--brd));border-radius:2px}
.hi{width:40px;height:40px;border-radius:12px;background:linear-gradient(145deg,var(--ac),#2b6f9e);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.hi svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hw b{display:block;font-size:14px;font-weight:700;margin-top:2px}
.hw .mut{margin-top:2px;font-size:13px}

/* ── Tickets ── */
.tk{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;background:var(--sf);border:1px solid var(--brd);border-radius:14px;padding:14px;transition:background .15s}
.tk:hover{background:var(--sf2)}
.tkb{
  display:grid;grid-template-columns:40px 1fr auto;
  gap:12px;align-items:center;text-align:left;
  background:var(--sf);border:1px solid var(--brd);border-radius:14px;padding:12px;
  cursor:pointer;transition:background .15s;width:100%;
}
.tkb:hover{background:var(--sf2)}
.ti{width:40px;height:40px;border-radius:11px;background:var(--sf2);color:var(--ac);display:flex;align-items:center;justify-content:center}
.ti svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ── Chat ── */
.chat{display:flex;flex-direction:column;gap:8px;padding:4px 0}
.bub{max-width:84%;padding:10px 12px;border-radius:15px;font-size:14px;display:flex;flex-direction:column;gap:3px;white-space:pre-wrap;word-break:break-word}
.bub small{font-size:11px;opacity:.6;font-weight:600}
.bub.me{align-self:flex-end;background:var(--ac);color:#fff;border-bottom-right-radius:4px}
.bub.th{align-self:flex-start;background:var(--sf2);border:1px solid var(--brd);border-bottom-left-radius:4px}
.compose{display:flex;gap:8px;align-items:flex-end;position:sticky;bottom:60px;background:var(--bg);padding:8px 0}
.compose textarea{flex:1;min-height:42px;max-height:120px;padding:10px 14px;border-radius:11px;border:1px solid var(--brd);background:var(--sf);color:var(--ink);font:inherit;resize:none}
.area{width:100%;min-height:90px;max-height:160px;padding:12px 14px;border-radius:11px;border:1px solid var(--brd);background:var(--sf);color:var(--ink);font:inherit;resize:none}

/* ── Profile ── */
.chips-row{display:flex;gap:8px;flex-wrap:wrap}
.chip-btn{border:1px solid var(--brd);background:var(--sf2);border-radius:20px;padding:7px 14px;font-weight:600;font-size:13px;color:var(--sub);transition:all .15s}
.chip-btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip-btn:hover:not(.on){border-color:var(--ac);color:var(--ac)}

/* ── Empty state ── */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:32px 16px;gap:12px}
.empty svg{opacity:.3}

/* ── Toast ── */
#toast{
  position:fixed;left:50%;bottom:82px;transform:translateX(-50%) translateY(10px);
  background:var(--ink);color:var(--bg);
  padding:11px 16px;border-radius:12px;font-size:13px;font-weight:600;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
  z-index:30;max-width:88%;text-align:center;white-space:nowrap;
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

details{border-top:1px solid var(--brd);padding-top:10px}
summary{font-weight:600;cursor:pointer;font-size:14px;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::after{content:"›";transition:transform .2s}
details[open] summary::after{transform:rotate(90deg)}
details ol{margin:10px 0 4px;padding-left:18px;font-size:13px;color:var(--sub);display:flex;flex-direction:column;gap:4px}
details p{margin-top:8px;font-size:13px;color:var(--sub)}
.sep{height:1px;background:var(--brd)}
.num-input{width:90px;height:38px;border-radius:9px;border:1px solid var(--brd);background:var(--sf2);color:var(--ink);font:inherit;font-weight:700;text-align:right;padding:0 10px}

/* ── v2 overrides ── */
.sec-head{display:flex;align-items:center;justify-content:center;gap:14px;margin:18px 0 4px}
.sec-head::before,.sec-head::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--brd))}
.sec-head::after{background:linear-gradient(270deg,transparent,var(--brd))}

// Правило экономии: если у игры сейчас есть скидка, берём цену со скидкой (sale), иначе среднюю цену (avg).
// Реальные значения подгружает бэкенд (GET /api/steam-prices, см. steam/steam_prices.py). Пока бэкенда нет, avg это оценка.
const STEAM_DATA = Object.fromEntries(Object.entries(STEAM_PRICE).map(([g,v]) => [g,{avg:v,sale:null,pct:0,est:true}]));
STEAM_DATA["Hollow Knight: Silksong"] = {avg:599,sale:null,pct:0,est:true};
const steamNow = g => { const d = STEAM_DATA[g]; return d ? (d.sale != null ? d.sale : d.avg) : 0; };
async function loadSteamPrices() {
  try {
    const res = await fetch("/api/steam-prices", {cache:"no-store"});
    if(!res.ok) return;
    const j = await res.json();
    for(const [g,v] of Object.entries(j)) STEAM_DATA[g] = Object.assign({}, STEAM_DATA[g], v, {est:false});
    render();
  } catch(e) {}
}

const TR={а:"a",б:"b",в:"v",г:"g",д:"d",е:"e",ж:"zh",з:"z",и:"i",й:"y",к:"k",л:"l",м:"m",н:"n",о:"o",п:"p",р:"r",с:"s",т:"t",у:"u",ф:"f",х:"h",ц:"c",ч:"ch",ш:"sh",щ:"sh",ы:"y",э:"e",ю:"yu",я:"ya",ь:"",ъ:""};

function norm(s){return s.toLowerCase().replace(/ё/g,"е").replace(/[''`™®]/g," ").replace(/[^a-zа-я0-9]+/g," ").trim()}
function cands(g){
  let c=AL.get(g);if(c)return c;
  const n=norm(g);c=[n];
  ALI.forEach(([k,a])=>{if(n.includes(k))a.split("|").forEach(x=>c.push(norm(x)))});
  AL.set(g,c);return c;
}
function lev(a,b){const m=a.length,n=b.length;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function variants(raw){
  const q=raw.toLowerCase(),v=[q];
  if(/[a-z]/.test(q)&&!/[а-я]/.test(q))v.push([...q].map(c=>{const i=EN.indexOf(c);return i<0?c:RU[i]}).join(""));
  if(/[а-я]/.test(q)&&!/[a-z]/.test(q)){v.push([...q].map(c=>{const i=RU.indexOf(c);return i<0?c:EN[i]}).join(""));v.push([...q.replace(/ё/g,"е")].map(c=>TR[c]??c).join(""))}
  return [...new Set(v.map(norm).filter(x=>x.length))];
}
function tokM(qt,ct){if(ct.startsWith(qt))return 1;if(qt.length<3)return 0;const d=qt.length<=4?1:2;return Math.min(lev(qt,ct),lev(qt,ct.slice(0,qt.length)))<=d?.7:0}
function sc1(c,q){
  if(c.includes(q))return c.startsWith(q)?4:3;
  const cs=c.replace(/ /g,""),qs=q.replace(/ /g,"");
  if(qs.length>=3&&cs.includes(qs))return 2.8;
  if(q.length<2)return 0;
  let qt=q.split(" ");if(qt.length>1)qt=qt.filter(t=>t!=="the"&&t!=="of");
  const ct=c.split(" ");let s=0;
  for(const t of qt){let b=0;for(const x of ct)b=Math.max(b,tokM(t,x));if(!b)return 0;s+=b}
  return 1+s/qt.length;
}
function scoreG(g,vs){let b=0;for(const c of cands(g))for(const q of vs)b=Math.max(b,sc1(c,q));return b}
function rank(list,q){const vs=variants(q);if(!vs.length)return list.slice();return list.map(g=>[g,scoreG(g,vs)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).map(x=>x[0])}
function rankS(list,q){const vs=variants(q);return list.map(g=>[g,scoreG(g,vs)]).filter(x=>x[1]>0)}

function gres() {
  const q = S.q, el = $("#gr"), h = $("#home");
  if(h) h.style.display = q ? "none" : "";
  if(!q) { el.innerHTML = ""; return; }
  if(q.length < 2) { el.innerHTML = `<div class="mut" style="padding:8px 4px">Введите хотя бы 2 символа</div>`; return; }
  const m = [];
  PACKS.forEach(p => rankS(p.games, q).forEach(([n,s]) => {
    if(!m.find(x=>x[0]===n)) m.push([n, p, s]);
  }));
  m.sort((a,b)=>b[2]-a[2]||a[0].localeCompare(b[0]));
  if(!m.length) {
    el.innerHTML = `<div class="card"><h3>Такой игры пока нет</h3><div class="mut">Нажмите кнопку — мы запишем запрос и добавим игру, если будет спрос.</div><button class="btn sec" style="margin-top:4px" data-act="want">Хочу эту игру</button></div>`;
    return;
  }
  el.innerHTML = `<div class="results">${m.slice(0,40).map(([n,p]) => `<div class="result-item">
    <button class="gname-btn" data-act="ginfo" data-g="${encodeURIComponent(n)}" data-pid="${p.id}">${n}</button>

    </span>
  </div>`).join("")}</div>`;
}

// ── Аналитика ──
// Сейчас данные демонстрационные (генерируются в браузере). Чтобы показывать реальные,
// замените genStats() на загрузку с вашего сервера в том же формате: STATS.days[] = {d:Date, visits, users, ords:[по наборам], pay:[по способам оплаты]}.
const HIST_PRICE = PACKS.map(p=>p.price.buy);
function mulberry(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a>>>15, 1 | a); t = t + Math.imul(t ^ t>>>7, 61 | t) ^ t; return ((t ^ t>>>14) >>> 0) / 4294967296; }; }
function genStats(){
  const rnd = mulberry(20261005), N = 90, today = new Date(); today.setHours(0,0,0,0);
  const days = [];
  for(let i=N-1;i>=0;i--){
    const d = new Date(today); d.setDate(d.getDate()-i);
    const wk = [0,6].includes(d.getDay()) ? 1.25 : 1, trend = 1 + (N-i)/N*0.6;
    const visits = Math.round((220 + rnd()*120) * wk * trend);
    const users = Math.round(visits * (0.12 + rnd()*0.05));
    const ords = PACKS.map((p,k) => Math.round(visits * [0.012,0.016,0.022][k] * (0.7 + rnd()*0.6)));
    const pay = [0,0,0,0];
    ords.forEach(c => { for(let j=0;j<c;j++){ const x = rnd(); pay[x<.42?0:x<.62?1:x<.78?2:3]++; } });
    days.push({d, visits, users, ords, pay});
  }
  return {days, baseUsers:900};
}
let STATS = genStats();
function statsLive(pid, pay){
  const d = STATS.days[STATS.days.length-1], k = PACKS.findIndex(p=>p.id===pid), j = Math.max(0, PAY.indexOf(pay));
  if(k < 0) return; d.ords[k]++; d.pay[j]++;
}

const nf = n => Math.round(n).toLocaleString("ru");
const cmp = v => v >= 1000 ? (v/1000).toFixed(v%1000 ? 1 : 0).replace(".",",") + "к" : String(Math.round(v));
const fmtDay = d => d.toLocaleDateString("ru", {day:"numeric", month:"short"});
const niceMax = v => { if(v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))), n = v/p; return ([1,1.5,2,3,4,5,6,8,10].find(s=>s>=n)) * p; };
const sumBy = (a,f) => a.reduce((s,x)=>s+f(x), 0);
function agg(days){
  const o = {visits:0, users:0, orders:0, rev:0, byPack:PACKS.map(()=>0), pay:[0,0,0,0]};
  days.forEach(d => {
    o.visits += d.visits; o.users += d.users;
    d.ords.forEach((c,k) => { o.orders += c; o.byPack[k] += c; o.rev += c*HIST_PRICE[k]; });
    d.pay.forEach((c,k) => o.pay[k] += c);
  });
  return o;
}

const CH = {};
function chartFrame(id, pts, fmt, kind){
  const W=340, H=176, L=34, R=6, T=8, B=22, iw=W-L-R, ih=H-T-B, n=pts.length;
  const max = niceMax(Math.max(...pts.map(p=>p.v)));
  const x = kind==="bar" ? (i => L + (i+.5)*iw/n) : (i => L + (n>1 ? i*iw/(n-1) : iw/2));
  const y = v => T + ih - (v/max)*ih;
  CH[id] = {pts, fmt, W, x:pts.map((_,i)=>x(i)), y:pts.map(p=>y(p.v))};
  let grid = "";
  for(let k=0;k<=4;k++){ const v = max*k/4, yy = y(v).toFixed(1); grid += `<line class="gline" x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/><text x="${L-5}" y="${(+yy+3).toFixed(1)}" text-anchor="end">${cmp(v)}</text>`; }
  const mid = Math.floor((n-1)/2);
  const xl = [[0,"start"],[mid,"middle"],[n-1,"end"]].filter((a,i,arr)=>n>2||i!==1).map(([i,a])=>`<text x="${x(i).toFixed(1)}" y="${H-6}" text-anchor="${n===1?"middle":a}">${pts[i].l}</text>`).join("");
  return {W,H,L,R,T,B,iw,ih,n,x,y,grid,xl};
}
function chartWrap(id, f, body){
  return `<div class="ch" data-ch="${id}"><div class="ch-tip">&nbsp;</div>
  <svg viewBox="0 0 ${f.W} ${f.H}" role="img">${f.grid}${body}${f.xl}
    <line class="mk" y1="${f.T}" y2="${f.T+f.ih}" style="display:none"/><circle class="mk-dot" r="4" style="display:none"/>
  </svg></div>`;
}
function areaChart(id, pts, fmt){
  const f = chartFrame(id, pts, fmt, "area");
  const line = pts.map((p,i)=>`${i?"L":"M"}${f.x(i).toFixed(1)} ${f.y(p.v).toFixed(1)}`).join("");
  const area = `${line}L${f.x(f.n-1).toFixed(1)} ${f.T+f.ih}L${f.x(0).toFixed(1)} ${f.T+f.ih}Z`;
  return chartWrap(id, f, `<defs><linearGradient id="g-${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--ac);stop-opacity:.35"/><stop offset="1" style="stop-color:var(--ac);stop-opacity:0"/></linearGradient></defs>
    <path d="${area}" fill="url(#g-${id})"/><path d="${line}" fill="none" style="stroke:var(--ac)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`);
}
function barChart(id, pts, fmt){
  const f = chartFrame(id, pts, fmt, "bar"), bw = Math.max(2, f.iw/f.n*0.66);
  const bars = pts.map((p,i)=>{ const h = Math.max(1, f.T+f.ih-f.y(p.v)); return `<rect x="${(f.x(i)-bw/2).toFixed(1)}" y="${(f.T+f.ih-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2" style="fill:var(--ok)"/>`; }).join("");
  return chartWrap(id, f, bars);
}
function chartShow(w, c, i){
  const mk = w.querySelector(".mk"), dot = w.querySelector(".mk-dot"), tip = w.querySelector(".ch-tip");
  mk.setAttribute("x1", c.x[i]); mk.setAttribute("x2", c.x[i]); mk.style.display = "";
  dot.setAttribute("cx", c.x[i]); dot.setAttribute("cy", c.y[i]); dot.style.display = "";
  tip.innerHTML = `<span style="color:var(--sub);font-weight:600">${c.pts[i].l}</span> · ${c.fmt(c.pts[i].v)}`;
}
function chartMove(e){
  const w = e.target.closest && e.target.closest(".ch"); if(!w) return;
  const c = CH[w.dataset.ch]; if(!c) return;
  const rc = w.querySelector("svg").getBoundingClientRect();
  const vx = (e.clientX - rc.left) / rc.width * c.W;
  let bi = 0, bd = 1e9; c.x.forEach((xx,i) => { const d = Math.abs(xx-vx); if(d < bd){ bd = d; bi = i; } });
  chartShow(w, c, bi);
}
function donut(vals, colors, center, label){
  const C = 2*Math.PI*52, tot = sumBy(vals, v=>v) || 1; let off = 0;
  const segs = vals.map((v,i) => { const len = v/tot*C; const s = `<circle cx="70" cy="70" r="52" fill="none" stroke="${colors[i]}" stroke-width="18" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 70 70)"/>`; off += len; return s; }).join("");
  return `<svg viewBox="0 0 140 140" width="140" height="140" style="flex-shrink:0"><circle cx="70" cy="70" r="52" fill="none" style="stroke:var(--sf2)" stroke-width="18"/>${segs}
    <text x="70" y="70" text-anchor="middle" class="dn-n">${center}</text><text x="70" y="88" text-anchor="middle" class="dn-l">${label}</text></svg>`;
}
function hbars(rows){
  const max = Math.max(1, ...rows.map(r=>r.v));
  return `<div class="hbs">${rows.map(r=>`<div class="hb"><div class="hb-top"><span>${r.l}</span><b>${r.t}</b></div><div class="hb-bar"><i style="width:${Math.round(r.v/max*100)}%;${r.c?`background:${r.c}`:""}"></i></div></div>`).join("")}</div>`;
}

// ── Реальная покупка через сервер (в Telegram): счёт Stars -> оплата -> выдача слота -> «Мои доступы» ──
async function loadOrders() {
  if(!tgInit()) return;
  try {
    const rows = await api("/api/orders");
    S.orders = rows.map(r => ({n:r.id, id:r.id, plan:"buy", exp:null, span:0,
      p: Object.assign({}, PACKS.find(x => x.id === r.pack_id) || {}, {name:r.name, login:r.login, pass:r.pass})}));
  } catch(e) {}
}
async function waitOrder(id) {
  for(let k = 0; k < 20; k++) {
    await loadOrders();
    if(S.orders.some(o => o.id === id)) return true;
    await new Promise(r => setTimeout(r, 1200));
  }
  return false;
}
async function realBuy(p) {
  const go = $("#go"), label = go.textContent;
  const reset = () => { go.disabled = false; go.textContent = label; };
  go.disabled = true; go.textContent = "Создаём счёт…";
  try {
    const j = await api("/api/orders", {method:"POST", body:{pack_id:p.id}});
    window.Telegram.WebApp.openInvoice(j.link, async st => {
      if(st === "paid") {
        go.textContent = "Выдаём доступ…";
        const ok = await waitOrder(j.order);
        closeSheet(); S.tab = "mine"; S.open = null; render();
        toast(ok ? "Оплачено! Данные для входа ниже" : "Оплата прошла. Данные появятся в «Мои доступы» через минуту");
      } else { reset(); if(st === "cancelled") toast("Оплата отменена"); else if(st === "failed") toast("Оплата не прошла"); }
    });
  } catch(e) { reset(); toast(e.message === "no_slots" ? "Свободных слотов сейчас нет" : "Не удалось создать счёт"); }
}

function checkout(p, plan, ext) {
  if(tgInit()) S.promo = null; // скидку по промокоду сервер пока не считает
  const b = priceOf(p), d = promoPct(S.promo);
  const t = Math.max(1, Math.round(b*(1-d/100)));
  sheet(`<h2>${ext!=null?"Продление":"Оплата"}</h2>
  <div class="mut">${p.name}</div>
  <div class="promo-row" style="${tgInit()?'display:none':''}">
    <input id="pc" placeholder="Промокод" value="${esc(S.promo||'')}" style="flex:1;height:42px;padding:0 14px;border-radius:11px;border:1px solid var(--brd);background:var(--sf2);color:var(--ink);font:inherit;text-transform:uppercase">
    <button class="btn sec sm" data-act="promo">Применить</button>
  </div>
  ${PAY.map(m=>`<button class="opt ${S.pay===m?'on':''}" data-act="pm" data-m="${m}">
    <span>${m}</span>
    ${m==="С баланса"?`<span class="mut">${r(S.bal)}</span>`:''}
  </button>`).join("")}
  <div class="sep"></div>
  <div class="sum"><span>Цена</span><span>${r(b)}</span></div>
  ${d?`<div class="sum"><span>Скидка ${d}%</span><span style="color:var(--ok)">−${r(b-t)}</span></div>`:''}
  <div class="sum total"><span>К оплате</span><span>${r(t)}</span></div>
  <div class="mut" style="font-size:12px;line-height:1.45">Гарантия возврата средств на баланс — 30 дней с момента покупки. Замены аккаунтов мы не делаем, все риски использования несёт покупатель.</div>
  <button class="btn pri" id="go">Оплатить ${r(t)}</button>`);
  S._co = [p, plan, ext];
  $("#go").onclick = () => {
    if(tgInit() && ext == null) { if(S.pay !== "Telegram Stars") { toast("Пока доступна оплата только через Telegram Stars"); return; } realBuy(p); return; }
    if(S.pay==="С баланса" && S.bal < t) { toast("Не хватает средств — пополните баланс"); return; }
    $("#go").textContent = "Проверяем…"; $("#go").disabled = true;
    setTimeout(()=>{
      if(S.pay==="С баланса") S.bal -= t;
      if(ext != null) {
        const o=S.orders[ext];
        o.exp = Math.max(o.exp, Date.now()) + 30*864e5; o.span=30;
      } else {
        S.orders.unshift({n:1001+S.orders.length,p,plan,exp:null,span:0});
      }
      S.spent += t; statsLive(p.id, S.pay); useCode(S.promo); S.promo = null; closeSheet(); S.tab="mine"; S.open=null; render();
      toast(ext!=null?"Доступ продлён ✓":"Оплачено! Данные для входа ниже");
    }, 900);
  };
}

// Drag-to-scroll for horizontal lists with a mouse
// Плавная прокрутка горизонтальных списков (стрелки, колесо мыши, перетаскивание с инерцией)
function hsAnim(h, to){
  const max = Math.max(0, h.scrollWidth - h.clientWidth);
  h._to = Math.max(0, Math.min(max, to));
  if(h._raf) return;
  const step = () => {
    const d = h._to - h.scrollLeft;
    if(Math.abs(d) < 1){ h.scrollLeft = h._to; h._raf = 0; return; }
    h.scrollLeft += Math.sign(d) * Math.max(1, Math.abs(d) * 0.16);
    h._raf = requestAnimationFrame(step);
  };
  h._raf = requestAnimationFrame(step);
}
const hsStop = h => { if(h._raf){ cancelAnimationFrame(h._raf); h._raf = 0; } };
let drag = null, noClick = false;
document.addEventListener("pointerdown", e => {
  if(e.pointerType !== "mouse" || e.button !== 0) return;
  const h = e.target.closest(".hs"); if(!h) return;
  hsStop(h);
  drag = {h, x:e.clientX, sl:h.scrollLeft, moved:false, s:[{x:e.clientX, t:performance.now()}]};
});
document.addEventListener("pointermove", e => {
  if(!drag) return;
  const dx = e.clientX - drag.x;
  if(!drag.moved && Math.abs(dx) > 5){ drag.moved = true; drag.h.classList.add("drag"); }
  if(drag.moved){
    drag.h.scrollLeft = drag.sl - dx;
    drag.s.push({x:e.clientX, t:performance.now()}); if(drag.s.length > 6) drag.s.shift();
  }
});
const endDrag = () => {
  if(!drag) return;
  const {h, moved, s} = drag; drag = null;
  if(moved){
    noClick = true; setTimeout(()=>{ noClick = false; h.classList.remove("drag"); }, 60);
    const a = s[0], b = s[s.length-1], dt = b.t - a.t;
    if(dt > 0 && performance.now() - b.t < 80){ const v = (b.x - a.x) / dt; hsAnim(h, h.scrollLeft - v*260); }
  }
};
// колесо обычной мыши листает список вбок; тачпад и конец списка — как обычно
document.addEventListener("wheel", e => {
  const h = e.target.closest && e.target.closest(".hs"); if(!h || e.ctrlKey || e.shiftKey) return;
  if(Math.abs(e.deltaX) >= Math.abs(e.deltaY)) return;
  const mouse = e.deltaMode === 1 || (Number.isInteger(e.deltaY) && Math.abs(e.deltaY) >= 50);
  if(!mouse) return;
  const max = h.scrollWidth - h.clientWidth, base = h._raf ? h._to : h.scrollLeft, dy = e.deltaMode === 1 ? e.deltaY*32 : e.deltaY;
  if((dy < 0 && base <= 0) || (dy > 0 && base >= max - 1)) return;
  e.preventDefault(); hsAnim(h, base + dy*1.2);
}, {passive:false});
document.addEventListener("pointerup", endDrag);
document.addEventListener("pointercancel", endDrag);

// Broken images
// Broken images: try alternative Steam sources, then remove
document.addEventListener("error", e => {
  const el = e.target; if(el.tagName !== "IMG") return;
  const m = el.src.match(/\/apps\/(\d+)\//);
  if(m){
    const id = m[1];
    const alts = [`${CDN}${id}/header.jpg`, `${CDN}${id}/capsule_616x353.jpg`,
      `https://cdn.cloudflare.steamstatic.com/steam/apps/${id}/header.jpg`,
      `https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/${id}/header.jpg`];
    el._tried = el._tried || new Set();
    el._tried.add(el.src);
    const next = alts.find(u => !el._tried.has(u));
    if(next){ el._tried.add(next); el.src = next; return; }
  }
  el.remove();
}, true);

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PlayVault</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151c2c;
      --card-border: #232d42;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 80px; user-select: none; }
    
    header {
      padding: 16px;
      background: var(--card-bg);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h1 { font-size: 18px; color: var(--accent); font-weight: 700; }
    .balance-badge {
      background: #1e293b;
      border: 1px solid var(--card-border);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }

    .nav {
      display: flex;
      background: var(--card-bg);
      border-top: 1px solid var(--card-border);
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      z-index: 100;
    }
    .nav-btn {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 11px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
    }
    .nav-btn.active { color: var(--accent); font-weight: 600; }

    .tab-content { display: none; padding: 16px; }
    .tab-content.active { display: block; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 12px;
      border: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card h3 { font-size: 14px; margin-bottom: 6px; line-height: 1.3; }
    .card .price { font-size: 15px; font-weight: 700; color: var(--accent); margin-bottom: 10px; }
    
    .btn {
      background: var(--accent);
      color: #0b0f19;
      border: none;
      padding: 10px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      width: 100%;
      text-align: center;
    }
    .btn:active { opacity: 0.8; }

    .access-item {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 14px;
      border: 1px solid var(--card-border);
      margin-bottom: 12px;
    }
    .access-item h4 { font-size: 15px; color: var(--accent); margin-bottom: 6px; }
    .credentials {
      background: #0b0f19;
      padding: 10px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 13px;
      margin-top: 8px;
      border: 1px dashed var(--card-border);
      word-break: break-all;
    }
  </style>
</head>
<body>

  <header>
    <h1>PlayVault</h1>
    <div class="balance-badge" id="user-balance">Баланс: 0 ₽</div>
  </header>

  <!-- Вкладка: Каталог -->
  <div id="tab-catalog" class="tab-content active">
    <div class="grid" id="packs-list">
      <p style="color: var(--text-muted); text-align: center; grid-column: 1/-1;">Загрузка каталога...</p>
    </div>
  </div>

  <!-- Вкладка: Мои доступы -->
  <div id="tab-access" class="tab-content">
    <div id="access-list">
      <p style="color: var(--text-muted); text-align: center;">Загрузка купленных товаров...</p>
    </div>
  </div>

  <!-- Нижная навигация -->
  <nav class="nav">
    <button class="nav-btn active" id="btn-catalog" onclick="switchTab('catalog')">
      <span>🎮</span> Каталог
    </button>
    <button class="nav-btn" id="btn-access" onclick="switchTab('access')">
      <span>🔑</span> Мои доступы
    </button>
  </nav>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    let currentUser = null;

    // Переключение вкладок
    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

      if (tabName === 'catalog') {
        document.getElementById('tab-catalog').classList.add('active');
        document.getElementById('btn-catalog').classList.add('active');
        loadPacks();
      } else if (tabName === 'access') {
        document.getElementById('tab-access').classList.add('active');
        document.getElementById('btn-access').classList.add('active');
        loadMyAccess();
      }
    }

    // Загрузка данных профиля и баланса
    async function loadUserData() {
      try {
        const initData = tg?.initData || '';
        const res = await fetch('/api/me', {
          headers: { 'x-telegram-init-data': initData }
        });
        if (res.ok) {
          currentUser = await res.json();
          document.getElementById('user-balance').innerText = `Баланс: ${currentUser.balance || 0} ₽`;
        }
      } catch (e) {
        console.error('Ошибка загрузки данных пользователя:', e);
      }
    }

    // Загрузка паков из API
    async function loadPacks() {
      const list = document.getElementById('packs-list');
      try {
        const initData = tg?.initData || '';
        const res = await fetch('/api/me', {
          headers: { 'x-telegram-init-data': initData }
        });
        
        if (!res.ok) throw new Error('Network error');
        const data = await res.json();
        const packs = data.packs || [];

        if (packs.length === 0) {
          list.innerHTML = '<p style="color: var(--text-muted); text-align: center; grid-column: 1/-1;">Каталог пуст.</p>';
          return;
        }

        list.innerHTML = packs.map(p => `
          <div class="card">
            <div>
              <h3>${p.name}</h3>
              <div class="price">${p.price} ₽</div>
            </div>
            <button class="btn" onclick="buyPack(${p.id})">Купить</button>
          </div>
        `).join('');

      } catch (e) {
        list.innerHTML = '<p style="color: var(--text-muted); text-align: center; grid-column: 1/-1;">Ошибка загрузки каталога.</p>';
      }
    }

    // Покупка товара (ИСПРАВЛЕННАЯ ЛОГИКА ОПЛАТЫ С БАЛАНСА)
    async function buyPack(packId) {
      try {
        const initData = tg?.initData || '';
        const res = await fetch('/api/orders', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'x-telegram-init-data': initData 
          },
          body: JSON.stringify({ pack_id: packId })
        });

        const data = await res.json();

        if (!res.ok) {
          if (data.error === 'no_slots') {
            alert('Свободных слотов сейчас нет');
          } else {
            alert(data.error || 'Не удалось создать заказ');
          }
          return;
        }

        // 1. Успешная списание средств с баланса аккаунта
        if (data.paid_via === 'balance' || (data.success && !data.link)) {
          alert('✅ Товар успешно куплен!');
          await loadUserData();
          switchTab('access');
          return;
        }

        // 2. Оплата через Telegram Stars (если передана ссылка на инвойс)
        if (data.link) {
          if (tg && tg.openInvoice) {
            tg.openInvoice(data.link, async (status) => {
              if (status === 'paid') {
                alert('✅ Оплата прошла успешно!');
                await loadUserData();
                switchTab('access');
              }
            });
          } else {
            window.location.href = data.link;
          }
        }
      } catch (err) {
        console.error(err);
        alert('Ошибка при обработке покупки');
      }
    }

    // Загрузка купленных доступов
    async function loadMyAccess() {
      const container = document.getElementById('access-list');
      try {
        const initData = tg?.initData || '';
        const res = await fetch('/api/orders', {
          headers: { 'x-telegram-init-data': initData }
        });

        if (!res.ok) throw new Error('Fetch failed');

        const items = await res.json();
        if (!items || items.length === 0) {
          container.innerHTML = '<p style="color: var(--text-muted); text-align: center;">У вас пока нет купленных доступов.</p>';
          return;
        }

        container.innerHTML = items.map(item => `
          <div class="access-item">
            <h4>${item.name || 'Товар'}</h4>
            <p style="font-size: 11px; color: var(--text-muted);">Дата покупки: ${new Date(item.created_at).toLocaleDateString()}</p>
            <div class="credentials">
              Логин: <strong>${item.login || '—'}</strong><br/>
              Пароль: <strong>${item.pass || '—'}</strong>
            </div>
          </div>
        `).join('');

      } catch (e) {
        container.innerHTML = '<p style="color: var(--text-muted); text-align: center;">Не удалось загрузить данные.</p>';
      }
    }

    // Стартовая инициализация
    loadUserData();
    loadPacks();
  </script>
</body>
</html>

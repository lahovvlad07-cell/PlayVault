<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>PlayVault</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 70px; -webkit-tap-highlight-color: transparent; }
    header { padding: 16px; background: var(--card-bg); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
    header h1 { font-size: 18px; color: var(--accent); }
    .balance-badge { background: #334155; padding: 6px 12px; border-radius: 20px; font-size: 14px; font-weight: bold; }
    
    .nav { display: flex; background: var(--card-bg); border-top: 1px solid #334155; position: fixed; bottom: 0; left: 0; right: 0; height: 60px; z-index: 100; }
    .nav-btn { flex: 1; border: none; background: transparent; color: var(--text-muted); font-size: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; }
    .nav-btn.active { color: var(--accent); font-weight: bold; }

    .tab-content { display: none; padding: 16px; }
    .tab-content.active { display: block; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .card { background: var(--card-bg); border-radius: 12px; padding: 12px; border: 1px solid #334155; display: flex; flex-direction: column; justify-content: space-between; }
    .card h3 { font-size: 15px; margin-bottom: 8px; }
    .card .price { font-size: 16px; font-weight: bold; color: var(--accent); margin-bottom: 12px; }
    
    .btn { background: var(--accent); color: #000; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; text-align: center; }
    .btn:active { background: var(--accent-hover); }

    .access-item { background: var(--card-bg); border-radius: 12px; padding: 14px; border: 1px solid #334155; margin-bottom: 12px; }
    .access-item h4 { font-size: 16px; color: var(--accent); margin-bottom: 8px; }
    .credentials { background: #0f172a; padding: 10px; border-radius: 6px; font-family: monospace; font-size: 13px; margin-top: 6px; border: 1px dashed #334155; word-break: break-all; }
  </style>
</head>
<body>

  <header>
    <h1>PlayVault</h1>
    <div class="balance-badge" id="user-balance">Баланс: 0 ₽</div>
  </header>

  <!-- Вкладка: Каталог -->
  <div id="tab-catalog" class="tab-content active">
    <div class="grid" id="packs-list">
      <p style="color: var(--text-muted);">Загрузка каталога...</p>
    </div>
  </div>

  <!-- Вкладка: Мои доступы -->
  <div id="tab-access" class="tab-content">
    <div id="access-list">
      <p style="color: var(--text-muted);">Загрузка купленных товаров...</p>
    </div>
  </div>

  <!-- Навигация -->
  <nav class="nav">
    <button class="nav-btn active" onclick="switchTab('catalog')">
      <span>🎮</span> Каталог
    </button>
    <button class="nav-btn" onclick="switchTab('access')">
      <span>🔑</span> Мои доступы
    </button>
  </nav>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    let currentUser = null;

    // Переключение вкладок
    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

      if (tabName === 'catalog') {
        document.getElementById('tab-catalog').classList.add('active');
        event.currentTarget.classList.add('active');
        loadPacks();
      } else if (tabName === 'access') {
        document.getElementById('tab-access').classList.add('active');
        event.currentTarget.classList.add('active');
        loadMyAccess();
      }
    }

    // Загрузка данных профиля и баланса
    async function loadUserData() {
      try {
        const initData = tg?.initData || '';
        const res = await fetch('/api/me', {
          headers: { 'x-telegram-init-data': initData }
        });
        if (res.ok) {
          currentUser = await res.json();
          document.getElementById('user-balance').innerText = `Баланс: ${currentUser.balance || 0} ₽`;
        }
      } catch (e) {
        console.error('Ошибка загрузки пользователя:', e);
      }
    }

    // Загрузка товаров
    async function loadPacks() {
      try {
        const res = await fetch('/api/me'); 
        const initData = tg?.initData || '';
        const packsRes = await fetch('/api/admin', {
          headers: { 'x-telegram-init-data': initData }
        });
        
        // Рендерим тестовые/доступные наборы
        const list = document.getElementById('packs-list');
        list.innerHTML = `
          <div class="card">
            <div>
              <h3>Cyberpunk 2077</h3>
              <div class="price">299 ₽</div>
            </div>
            <button class="btn" onclick="buyPack(1)">Купить</button>
          </div>
          <div class="card">
            <div>
              <h3>Elden Ring</h3>
              <div class="price">399 ₽</div>
            </div>
            <button class="btn" onclick="buyPack(2)">Купить</button>
          </div>
        `;
      } catch (e) {
        console.error(e);
      }
    }

    // Покупка товара (ИСПРАВЛЕННАЯ ЛОГИКА)
    async function buyPack(packId) {
      try {
        const initData = tg?.initData || '';
        const res = await fetch('/api/orders', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'x-telegram-init-data': initData 
          },
          body: JSON.stringify({ pack_id: packId })
        });

        const data = await res.json();

        if (!res.ok) {
          alert(data.error === 'no_slots' ? 'Нет свободных слотов' : (data.error || 'Ошибка создания заказа'));
          return;
        }

        // 1. Успешная покупка с баланса без вызова окна Stars
        if (data.paid_via === 'balance' || (data.success && !data.link)) {
          alert('✅ Оплата успешно прошла с баланса!');
          await loadUserData();
          switchTab('access');
          return;
        }

        // 2. Оплата через Telegram Stars (если передана валидная ссылка)
        if (data.link) {
          if (tg && tg.openInvoice) {
            tg.openInvoice(data.link, async (status) => {
              if (status === 'paid') {
                alert('✅ Оплата прошла успешно!');
                await loadUserData();
                switchTab('access');
              }
            });
          } else {
            window.location.href = data.link;
          }
        }
      } catch (err) {
        console.error(err);
        alert('Произошла ошибка при обработке запроса');
      }
    }

    // Загрузка купленных доступов
    async function loadMyAccess() {
      const container = document.getElementById('access-list');
      try {
        const initData = tg?.initData || '';
        const res = await fetch('/api/orders', {
          headers: { 'x-telegram-init-data': initData }
        });

        if (!res.ok) throw new Error('Failed to fetch');

        const items = await res.json();
        if (!items || items.length === 0) {
          container.innerHTML = '<p style="color: var(--text-muted);">У вас пока нет купленных доступов.</p>';
          return;
        }

        container.innerHTML = items.map(item => `
          <div class="access-item">
            <h4>${item.name || 'Набор игр'}</h4>
            <p style="font-size: 12px; color: var(--text-muted);">Дата покупки: ${new Date(item.created_at).toLocaleDateString()}</p>
            <div class="credentials">
              Логин: <strong>${item.login || '—'}</strong><br/>
              Пароль: <strong>${item.pass || '—'}</strong>
            </div>
          </div>
        `).join('');

      } catch (e) {
        container.innerHTML = '<p style="color: var(--text-muted);">Ошибка загрузки доступов.</p>';
      }
    }

    // Инициализация
    loadUserData();
    loadPacks();
  </script>
</body>
</html>

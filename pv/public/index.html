<title>PlayVault</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* === TOKENS ===
   Layout: fixed bottom nav, scrollable main, bottom-sheet overlays
   Dark-first (Steam-style dark UI) */
:root {
  --bg: #0e1117;
  --sf: #161b27;
  --sf2: #1e2535;
  --sf3: #252e42;
  --ink: #e2e8f4;
  --sub: #8b9ab8;
  --brd: #2a3448;
  --ac: #5ba3d9;
  --ac2: #4090c8;
  --ok: #5cb87a;
  --warn: #e8a84a;
  --hot: #e05c5c;
  --acink: #fff;
  color-scheme: dark;
}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f0f4f9;--sf:#fff;--sf2:#e8edf5;--sf3:#dde3ed;
  --ink:#1a2235;--sub:#5a6a85;--brd:#d0d8e8;
  --ac:#1a6fad;--ac2:#1560980;--ok:#1e8a46;--warn:#b06010;--hot:#c03030;--acink:#fff;
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#f0f4f9;--sf:#fff;--sf2:#e8edf5;--sf3:#dde3ed;
  --ink:#1a2235;--sub:#5a6a85;--brd:#d0d8e8;
  --ac:#1a6fad;--ac2:#156098;--ok:#1e8a46;--warn:#b06010;--hot:#c03030;--acink:#fff;
  color-scheme:light;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
*{scrollbar-width:none;scrollbar-color:transparent transparent}
*::-webkit-scrollbar{width:0;height:0;background:transparent}
*::-webkit-scrollbar-thumb,*::-webkit-scrollbar-track{background:transparent}
.pack-refs{display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:flex-end}
body{
  font:400 15px/1.5 Inter,system-ui,sans-serif;
  background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;
  padding:0 0 env(safe-area-inset-bottom,0px);
  overflow-x:hidden;
}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,textarea{font:inherit;color:inherit}
img{max-width:100%;display:block}
a{color:var(--ac)}

/* ── Layout ── */
#app{display:flex;flex-direction:column;max-width:440px;margin:0 auto;min-height:100%;position:relative}
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px 10px;
  padding-top:calc(12px + env(safe-area-inset-top,0px));
  background:var(--bg);
  position:sticky;top:0;z-index:10;
  border-bottom:1px solid var(--brd);
}
.logo{font-weight:800;font-size:19px;letter-spacing:-.03em;color:var(--ink)}
.logo span{color:var(--ac)}
#balchip{
  display:flex;align-items:center;gap:6px;
  background:var(--sf2);border:1px solid var(--brd);
  border-radius:20px;padding:6px 12px;
  font-weight:700;font-size:13px;cursor:pointer;
  transition:background .15s;
}
#balchip:hover{background:var(--sf3)}
#balchip::before{content:"₽";opacity:.6;font-size:11px}
main{flex:1;padding:12px 16px 90px;display:flex;flex-direction:column;gap:10px}
nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:440px;
  background:var(--sf);border-top:1px solid var(--brd);
  display:grid;grid-template-columns:repeat(3,1fr);
  padding-bottom:env(safe-area-inset-bottom,0px);
  z-index:10;
}
nav button{
  background:none;border:0;padding:10px 0 8px;
  color:var(--sub);font-weight:600;font-size:11px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  transition:color .15s;position:relative;
}
nav button.on{color:var(--ac)}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[data-n]::after{
  content:attr(data-n);position:absolute;top:5px;left:calc(50% + 8px);
  min-width:16px;height:16px;border-radius:9px;
  background:var(--hot);color:#fff;font-size:10px;font-weight:800;
  display:flex;align-items:center;justify-content:center;padding:0 3px;
}

/* ── Type ── */
h2{font-size:18px;font-weight:800;letter-spacing:-.02em}
h3{font-size:15px;font-weight:700}
.mut{color:var(--sub);font-size:13px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px}
.sec-head h2{font-size:17px}

/* ── Cards ── */
.card{background:var(--sf);border:1px solid var(--brd);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card.lead{background:linear-gradient(135deg,#1e3a5f,#12263d);border-color:rgba(91,163,217,.3)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}

/* ── Buttons ── */
.btn{
  height:48px;border-radius:13px;font-weight:700;font-size:15px;
  padding:0 18px;display:flex;align-items:center;justify-content:center;gap:8px;
  transition:opacity .15s,transform .1s;width:100%;
}
.btn:active{opacity:.85;transform:scale(.98)}
.btn.pri{background:var(--ac);color:#fff}
.btn.sec{background:var(--sf2);color:var(--ink);border:1px solid var(--brd)}
.btn.sm{height:36px;font-size:13px;border-radius:10px;width:auto;padding:0 14px}
.btn:disabled{opacity:.5;pointer-events:none}
.back{color:var(--ac);font-weight:600;font-size:14px;padding:4px 0;align-self:flex-start;display:flex;align-items:center;gap:4px}
.back::before{content:"←"}

/* ── Search ── */
.search-wrap{position:relative}
.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--sub);fill:none;stroke-width:2;stroke-linecap:round}
.search{
  width:100%;height:46px;padding:0 16px 0 42px;
  border-radius:13px;border:1px solid var(--brd);
  background:var(--sf);color:var(--ink);
  font-size:15px;font-size:max(15px,16px);
  transition:border-color .15s;
}
.search:focus{outline:none;border-color:var(--ac)}

/* ── Pack rows ── */
.pack{
  display:grid;grid-template-columns:64px 1fr auto;
  gap:12px;align-items:center;
  background:var(--sf);border:1px solid var(--brd);
  border-radius:16px;padding:12px 14px;
  text-align:left;width:100%;
  transition:background .15s;
}
.pack:hover,.pack:focus-visible{background:var(--sf2)}
.cover{
  width:64px;height:64px;border-radius:12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#fff;overflow:hidden;position:relative;flex-shrink:0;
}
.cover b{font-size:22px;font-weight:800;line-height:1;position:relative;z-index:1}
.cover span{font-size:10px;font-weight:600;opacity:.85;margin-top:3px;position:relative;z-index:1}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pack .nm{font-weight:800;font-size:15px;line-height:1.2}
.pack .sub{font-size:12px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price-col{text-align:right;flex-shrink:0}
.price{font-weight:800;font-size:16px;white-space:nowrap}
.old-price{text-decoration:line-through;color:var(--sub);font-size:12px}
.disc-badge{
  display:inline-block;background:var(--hot);color:#fff;
  font-size:11px;font-weight:800;padding:2px 6px;border-radius:6px;
}

/* ── Tags ── */
.tag{font-size:12px;font-weight:600;padding:3px 9px;border-radius:8px;background:var(--sf2);color:var(--sub);display:inline-block}
.tag.ok{background:rgba(92,184,122,.15);color:var(--ok)}
.tag.warn{background:rgba(232,168,74,.15);color:var(--warn)}
.tag.hot{background:rgba(224,92,92,.15);color:var(--hot)}

/* ── Bar ── */
.bar{height:5px;border-radius:9px;background:var(--sf2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);border-radius:9px}

/* ── Hero banner ── */
.hero{
  border-radius:18px;padding:22px 20px;
  background:linear-gradient(130deg,#1a3a60 0%,#0e1e38 60%,#111827 100%);
  position:relative;overflow:hidden;
}
.hero::before{
  content:"";position:absolute;right:-40px;top:-40px;
  width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle,rgba(91,163,217,.18),transparent 70%);
}
.hero h2{font-size:22px;line-height:1.2;color:#fff;position:relative}
.hero p{color:rgba(255,255,255,.7);font-size:14px;margin-top:6px;position:relative}
.hero-stats{display:flex;gap:8px;margin-top:12px;position:relative;flex-wrap:wrap}
.hero-stats span{
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);
  border-radius:9px;padding:6px 11px;font-size:13px;font-weight:600;color:#fff;
}
.hero-actions{display:flex;gap:8px;margin-top:14px;position:relative;flex-wrap:wrap}

/* ── Savings badge ── */
.savings{
  background:rgba(92,184,122,.15);border:1px solid rgba(92,184,122,.25);
  border-radius:10px;padding:10px 14px;
  display:flex;align-items:center;gap:10px;
}
.savings .big{font-size:18px;font-weight:800;color:var(--ok)}

/* ── Horizontal scroll cards ── */
.hs-wrap{margin:0 -16px;padding:0 16px}
.hs{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x mandatory;padding-bottom:4px}
.hs::-webkit-scrollbar{display:none}
.gt{
  flex:none;width:110px;height:152px;border-radius:14px;
  padding:10px;display:flex;flex-direction:column;justify-content:flex-end;
  color:#fff;text-align:left;border:0;position:relative;overflow:hidden;
  scroll-snap-align:start;transition:transform .15s;
  cursor:pointer;
}
.gt:hover{transform:scale(1.04)}
.gt::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,rgba(0,0,0,.75));z-index:1}
.gt i{position:absolute;top:4px;left:8px;font:800 52px/1 Inter,sans-serif;font-style:normal;opacity:.18}
.gt .gl{position:relative;z-index:2;font-size:12px;font-weight:700;line-height:1.25}
.gt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}

/* ── Rec card ── */
.rec{background:var(--sf);border:1px solid var(--brd);border-radius:18px;overflow:hidden}
.rec-img{aspect-ratio:460/215;position:relative;overflow:hidden;cursor:pointer}
.rec-img>span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:800 72px Inter,sans-serif;color:rgba(255,255,255,.2);z-index:0}
.rec-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.rec-img::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.5),transparent 50%);z-index:2}
.rbadge{position:absolute;top:12px;left:12px;background:rgba(10,14,22,.7);backdrop-filter:blur(4px);color:#fff;font-size:12px;font-weight:700;padding:5px 10px;border-radius:8px;z-index:3}
.rbadge.disc{left:auto;right:12px;background:var(--hot);color:#fff}
.rec-body{padding:16px;display:flex;flex-direction:column;gap:12px}

/* ── Detail page ── */
.pack-hero{border-radius:16px;overflow:hidden;position:relative;min-height:96px;display:flex;align-items:center;padding:18px}
.pack-hero .t{display:flex;flex-direction:column;gap:4px;color:#fff}
.pack-hero .t b{font-size:44px;font-weight:800;line-height:1;letter-spacing:-.04em}
.pack-hero .t span{font-size:13px;font-weight:600;opacity:.85}
.stk{display:flex;margin-left:auto}
.stk i{width:46px;height:46px;border-radius:12px;border:2px solid rgba(255,255,255,.5);margin-left:-12px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;font:800 20px Inter,sans-serif;font-style:normal;color:#fff}
.stk i:first-child{margin-left:0}
.stk i img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* ── Game list ── */
.glist{max-height:min(340px,40vh);overflow:auto;border:1px solid var(--brd);border-radius:13px;scrollbar-width:thin;scrollbar-color:transparent transparent}
.glist::-webkit-scrollbar{width:4px}
.glist::-webkit-scrollbar-track{background:transparent}
.glist::-webkit-scrollbar-thumb{background:transparent;border-radius:4px}
.glist:hover::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12)}
.glist-item{
  padding:10px 14px;border-bottom:1px solid var(--brd);
  display:flex;align-items:center;gap:10px;
  font-size:14px;
}
.glist-item:last-child{border:0}
.glist-item img{width:44px;height:20px;border-radius:4px;object-fit:cover;flex-shrink:0}
.gname-btn{
  background:none;border:0;padding:0;text-align:left;color:var(--ink);
  font:inherit;cursor:pointer;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:14px;
}
.gname-btn:hover{color:var(--ac);text-decoration:underline;text-underline-offset:2px}
.fav{font-size:16px;padding:4px 6px;flex-shrink:0;opacity:.5;transition:opacity .15s,color .15s}
.fav:hover,.fav.on{opacity:1}
.fav.on{color:#e05c5c}

/* ── Credentials ── */
.cred{background:var(--sf2);border:1px solid var(--brd);border-radius:11px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.cred small{display:block;color:var(--sub);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.cred code{font:700 15px ui-monospace,Menlo,monospace;word-break:break-all}
.ico{color:var(--ac);font-weight:600;font-size:13px;padding:6px;border-radius:8px;transition:background .15s}
.ico:hover{background:var(--sf3)}
.code-display{
  font:800 30px ui-monospace,Menlo,monospace;
  letter-spacing:.2em;text-align:center;
  padding:16px;background:var(--sf2);border-radius:11px;
}

/* ── Sheet ── */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:20;backdrop-filter:blur(2px)}
.sheet.open{display:flex}
.sheet>div{
  background:var(--sf);width:100%;max-width:440px;
  border-radius:22px 22px 0 0;
  padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:12px;
  max-height:88vh;overflow:auto;
  scrollbar-width:thin;scrollbar-color:transparent transparent;
}
.sheet>div::-webkit-scrollbar{width:4px}
.sheet>div::-webkit-scrollbar-track{background:transparent}
.sheet>div::-webkit-scrollbar-thumb{background:transparent;border-radius:4px}
.sheet>div:hover::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12)}
#sb.co-sheet{overflow:hidden}
.sheet-scroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;min-height:0;scrollbar-width:thin;scrollbar-color:transparent transparent}
.sheet-scroll:hover::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12)}
.sheet-scroll::-webkit-scrollbar{width:4px}
.sheet-scroll::-webkit-scrollbar-track{background:transparent}
.sheet-scroll::-webkit-scrollbar-thumb{background:transparent;border-radius:4px}
.sheet-handle{width:36px;height:4px;background:var(--brd);border-radius:2px;margin:0 auto -4px}
.opt{
  display:flex;justify-content:space-between;align-items:center;
  width:100%;background:var(--sf2);border:1.5px solid transparent;
  border-radius:13px;padding:0 14px;font-weight:600;text-align:left;
  transition:border-color .15s;height:52px;min-height:52px;max-height:52px;
  box-sizing:border-box;overflow:hidden;flex-shrink:0;
}
.opt.on{border-color:var(--ac)}
.sum{display:flex;justify-content:space-between;font-size:14px}
.sum.total{font-weight:800;font-size:17px}
.promo-row{display:flex;gap:8px}
.promo-row input{
  flex:1;height:42px;padding:0 14px;border-radius:11px;
  border:1px solid var(--brd);background:var(--sf2);
  color:var(--ink);text-transform:uppercase;font:inherit;
}

/* ── Game info sheet ── */
.gcv{width:100%;aspect-ratio:16/7;border-radius:14px;overflow:hidden;position:relative;flex-shrink:0}
.gcv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gcv::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.55),transparent 50%)}
.gcv-title{position:absolute;bottom:12px;left:14px;right:14px;color:#fff;font-size:18px;font-weight:800;line-height:1.2;z-index:1}
.gbadge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:8px;background:rgba(91,163,217,.15);color:var(--ac);border:1px solid rgba(91,163,217,.25)}

/* ── Search results ── */
.results{border:1px solid var(--brd);border-radius:13px;overflow:hidden}
.result-item{
  padding:10px 14px;border-bottom:1px solid var(--brd);
  display:flex;align-items:center;gap:10px;font-size:14px;cursor:default;
}
.result-item:last-child{border:0}
.pack-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.pack-ref{display:flex;align-items:center;gap:6px;color:var(--sub);font-size:12px;flex-shrink:0;cursor:pointer}
.pack-ref:hover{color:var(--ac)}

/* ── How it works ── */
.how{display:flex;flex-direction:column}
.hw{display:grid;grid-template-columns:40px 1fr;gap:14px;position:relative;padding-bottom:20px}
.hw:last-child{padding-bottom:0}
.hw:not(:last-child)::before{content:"";position:absolute;left:19px;top:44px;bottom:4px;width:2px;background:linear-gradient(var(--ac),var(--brd));border-radius:2px}
.hi{width:40px;height:40px;border-radius:12px;background:linear-gradient(145deg,var(--ac),#2b6f9e);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.hi svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hw b{display:block;font-size:14px;font-weight:700;margin-top:2px}
.hw .mut{margin-top:2px;font-size:13px}

/* ── Tickets ── */
.tk{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;background:var(--sf);border:1px solid var(--brd);border-radius:14px;padding:14px;transition:background .15s}
.tk:hover{background:var(--sf2)}
.tkb{
  display:grid;grid-template-columns:40px 1fr auto;
  gap:12px;align-items:center;text-align:left;
  background:var(--sf);border:1px solid var(--brd);border-radius:14px;padding:12px;
  cursor:pointer;transition:background .15s;width:100%;
}
.tkb:hover{background:var(--sf2)}
.ti{width:40px;height:40px;border-radius:11px;background:var(--sf2);color:var(--ac);display:flex;align-items:center;justify-content:center}
.ti svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ── Chat ── */
.chat{display:flex;flex-direction:column;gap:8px;padding:4px 0}
.bub{max-width:84%;padding:10px 12px;border-radius:15px;font-size:14px;display:flex;flex-direction:column;gap:3px;white-space:pre-wrap;word-break:break-word}
.bub small{font-size:11px;opacity:.6;font-weight:600}
.bub.me{align-self:flex-end;background:var(--ac);color:#fff;border-bottom-right-radius:4px}
.bub.th{align-self:flex-start;background:var(--sf2);border:1px solid var(--brd);border-bottom-left-radius:4px}
.compose{display:flex;gap:8px;align-items:flex-end;position:sticky;bottom:60px;background:var(--bg);padding:8px 0}
.compose textarea{flex:1;min-height:42px;max-height:120px;padding:10px 14px;border-radius:11px;border:1px solid var(--brd);background:var(--sf);color:var(--ink);font:inherit;resize:none}
.area{width:100%;min-height:90px;max-height:160px;padding:12px 14px;border-radius:11px;border:1px solid var(--brd);background:var(--sf);color:var(--ink);font:inherit;resize:none}

/* ── Profile ── */
.chips-row{display:flex;gap:8px;flex-wrap:wrap}
.chip-btn{border:1px solid var(--brd);background:var(--sf2);border-radius:20px;padding:7px 14px;font-weight:600;font-size:13px;color:var(--sub);transition:all .15s}
.chip-btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip-btn:hover:not(.on){border-color:var(--ac);color:var(--ac)}

/* ── Empty state ── */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:32px 16px;gap:12px}
.empty svg{opacity:.3}

/* ── Toast ── */
#toast{
  position:fixed;left:50%;bottom:82px;transform:translateX(-50%) translateY(10px);
  background:var(--ink);color:var(--bg);
  padding:11px 16px;border-radius:12px;font-size:13px;font-weight:600;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
  z-index:30;max-width:88%;text-align:center;white-space:nowrap;
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

details{border-top:1px solid var(--brd);padding-top:10px}
summary{font-weight:600;cursor:pointer;font-size:14px;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::after{content:"›";transition:transform .2s}
details[open] summary::after{transform:rotate(90deg)}
details ol{margin:10px 0 4px;padding-left:18px;font-size:13px;color:var(--sub);display:flex;flex-direction:column;gap:4px}
details p{margin-top:8px;font-size:13px;color:var(--sub)}
.sep{height:1px;background:var(--brd)}
.num-input{width:90px;height:38px;border-radius:9px;border:1px solid var(--brd);background:var(--sf2);color:var(--ink);font:inherit;font-weight:700;text-align:right;padding:0 10px}

/* ── v2 overrides ── */
.sec-head{display:flex;align-items:center;justify-content:center;gap:14px;margin:18px 0 4px}
.sec-head::before,.sec-head::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--brd))}
.sec-head::after{background:linear-gradient(270deg,transparent,var(--brd))}
.sec-head h2{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--sub);text-align:center}

.pack{grid-template-columns:104px 1fr;align-items:center}
.cover{width:104px;height:auto;aspect-ratio:460/215;border-radius:10px;display:block}
.cover .cl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:800 24px Inter,sans-serif;opacity:.4;margin:0}
.pinfo{min-width:0;display:flex;flex-direction:column;gap:4px}
.prow{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.prow .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pprice{display:flex;flex-direction:column;align-items:flex-end;flex-shrink:0;line-height:1.15}
.ptags{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.ptags .tag{font-size:11px;padding:2px 7px}

.pack-hero{flex-direction:column;align-items:stretch;gap:14px;padding:16px}
.pack-hero .t{flex-direction:row;align-items:baseline;justify-content:center;gap:8px}
.pack-hero .t b{font-size:32px}
.stk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0}
.stk .th{aspect-ratio:460/215;border-radius:9px;overflow:hidden;position:relative;border:1px solid rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font:800 20px Inter,sans-serif;color:rgba(255,255,255,.5)}
.stk .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

.hs-wrap{position:relative}
.hs{cursor:grab}
.hs.drag{scroll-snap-type:none;cursor:grabbing;user-select:none}
.hs img{pointer-events:none;-webkit-user-drag:none}
.hs-arr{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;background:rgba(14,17,23,.88);border:1px solid var(--brd);color:var(--ink);font-size:22px;line-height:1;display:none;align-items:center;justify-content:center;z-index:3;padding-bottom:2px}
.hs-arr.l{left:8px}
.hs-arr.r{right:8px}
.hs-arr:hover{background:var(--sf2)}
@media(hover:hover) and (pointer:fine){.hs-arr{display:flex}}

/* ── v3 ── */
#balchip::before{content:none}
#balchip{padding:6px 14px}
#toast{white-space:normal;width:max-content;max-width:88%}
input::placeholder,textarea::placeholder{text-transform:none}
#mp,#pc{text-transform:uppercase}
.prof{gap:14px}
.prof-top{display:flex;align-items:center;gap:12px}
.avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(145deg,var(--ac),#2b6f9e);color:#fff;font:800 19px Inter,sans-serif;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pname{font-weight:800;font-size:16px;line-height:1.2;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card.lead .mut{color:rgba(255,255,255,.66)}
.bal{font-size:36px;font-weight:800;color:#fff;letter-spacing:-.02em;line-height:1.1;margin-top:2px}
.topup{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.topup .btn{height:42px;font-size:14px;padding:0}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat3>div{background:var(--sf);border:1px solid var(--brd);border-radius:14px;padding:12px 6px;text-align:center;min-width:0}
.stat3 b{display:block;font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat3 span{font-size:11px;color:var(--sub);font-weight:600}
.row-in{display:flex;gap:8px}
.row-in input{flex:1;min-width:0;height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--brd);background:var(--sf2);color:var(--ink);font:inherit}
.row-in input:focus{outline:none;border-color:var(--ac)}
.row-in .btn{width:auto;height:44px;padding:0 18px;font-size:14px}

.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--sf);border:1px solid var(--brd);border-radius:13px;padding:4px}
.seg button{height:36px;border-radius:10px;font-size:13px;font-weight:700;color:var(--sub);display:flex;align-items:center;justify-content:center;gap:4px}
.seg button.on{background:var(--ac);color:#fff}
.seg i{font-style:normal;background:var(--hot);color:#fff;font-size:10px;font-weight:800;border-radius:8px;padding:0 5px;min-width:16px;height:16px;line-height:16px;text-align:center}
.a-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.a-head .chip-btn{padding:6px 11px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--sf);border:1px solid var(--brd);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px;text-align:left;min-width:0}
button.kpi:hover{background:var(--sf2)}
.kpi small{color:var(--sub);font-size:12px;font-weight:600}
.kpi b{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.1;white-space:nowrap}
.dl{font-size:12px;font-weight:700}
.dl.up{color:var(--ok)}.dl.dn{color:var(--hot)}.dl.fl{color:var(--sub)}
.ch{position:relative}
.ch-tip{font-size:12px;font-weight:700;min-height:18px;margin-bottom:4px}
.ch svg{width:100%;height:auto;display:block;touch-action:pan-y}
.ch text{fill:var(--sub);font:10px Inter,sans-serif}
.ch .gline{stroke:var(--brd);stroke-width:1;stroke-dasharray:3 3}
.ch .mk{stroke:var(--sub);stroke-width:1}
.ch .mk-dot{fill:var(--ac);stroke:var(--sf);stroke-width:2}
.hbs{display:flex;flex-direction:column;gap:12px}
.hb{display:flex;flex-direction:column;gap:5px;min-width:0}
.hb-top{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.hb-bar{height:8px;border-radius:5px;background:var(--sf2);overflow:hidden}
.hb-bar i{display:block;height:100%;border-radius:5px;background:var(--ac)}
.dn-wrap{display:flex;align-items:center;gap:16px}
.dn-n{font:800 22px Inter,sans-serif;fill:var(--ink)!important}
.dn-l{font:600 11px Inter,sans-serif}
.dn-leg{display:flex;flex-direction:column;gap:12px;min-width:0}
.dn-leg>div{display:flex;gap:10px;align-items:flex-start}
.dn-leg i{width:10px;height:10px;border-radius:3px;margin-top:5px;flex-shrink:0}
.wrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--brd)}
.wrow:first-child{border-top:0;padding-top:4px}
.wrow.dim{opacity:.6}
.wact{display:flex;gap:6px}
.sq{width:36px;height:36px;border-radius:10px;background:var(--sf2);border:1px solid var(--brd);font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center}
.sq:hover{background:var(--sf3)}

/* ── v4 ── */
.prof{align-items:center;text-align:center;gap:16px;padding:24px 16px 18px}
.prof-top{flex-direction:column;gap:10px}
.prof-top>div{text-align:center;max-width:100%}
.avatar{width:62px;height:62px;font-size:25px}
.prof .pname{font-size:18px;text-align:center}
.bal-box{width:100%;padding-top:16px;border-top:1px solid rgba(255,255,255,.12)}
.bal{font-size:42px;margin-top:4px}
.btn.light{background:#fff;color:#12263d}
.btn.light:active{opacity:.9}
.prof .btn{max-width:280px}
.prof-compact{padding:14px 14px 12px;display:flex;flex-direction:column;gap:0}
.prof-row{display:flex;align-items:center;gap:10px}
.pe-chip{display:inline-flex;align-items:center;gap:4px;background:var(--sf3);border:1px solid var(--brd);border-radius:20px;padding:3px 8px 3px 10px;font-size:13px;color:var(--ink)}
.pe-chip-x{background:none;border:none;color:var(--sub);font-size:13px;cursor:pointer;padding:0;line-height:1;display:flex;align-items:center}
.cred-sep{padding:10px 0 6px;border-top:1px solid var(--brd);margin-top:4px}
.pf-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pf-grid label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--sub);min-width:0}
.pf-grid label.wide{grid-column:1/-1}
.pf-grid input{height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--brd);background:var(--sf2);color:var(--ink);font:inherit;font-size:15px;width:100%}
.pf-grid input:focus{outline:none;border-color:var(--ac)}
.clist{display:flex;flex-direction:column}
.crow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--brd)}
.crow.dim{opacity:.55}
.ccode{font:800 15px ui-monospace,Menlo,monospace;letter-spacing:.04em}

/* ── v5 ── */
/* починка бейджей «Рекомендуем» и скидки на большой карточке */
.rec-img>.rbadge{inset:12px auto auto 12px;display:block;font:700 12px/1 Inter,sans-serif;color:#fff;background:rgba(10,14,22,.72);padding:6px 10px;border-radius:8px;z-index:3}
.rec-img>.rbadge.disc{inset:12px 12px auto auto;background:var(--hot);font-size:14px;font-weight:800;padding:7px 11px}
.cover .cbadge{position:absolute;top:4px;left:4px;z-index:3;margin:0;opacity:1;background:var(--hot);color:#fff;font:800 11px/1 Inter,sans-serif;padding:3px 6px;border-radius:6px}
.pack-hero{position:relative}
.hero-badge{position:absolute;top:14px;right:14px;background:var(--hot);color:#fff;font:800 13px/1 Inter,sans-serif;padding:7px 11px;border-radius:9px}
.btn-old{opacity:.7;font-weight:600;margin-left:8px;font-size:14px}
.gt-badge{position:absolute;top:8px;right:8px;z-index:3;background:var(--hot);color:#fff;font:800 11px/1 Inter,sans-serif;padding:4px 6px;border-radius:6px}

.fvl{display:flex;flex-direction:column}
.fv{display:grid;grid-template-columns:76px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--brd)}

.fv-img{aspect-ratio:460/215;border-radius:8px;overflow:hidden;position:relative}
.fv-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fv-t{min-width:0}
.fv-t .gname-btn{display:block;max-width:100%;font-weight:600}

/* ── v6 ── */
.pprice{flex-direction:row;align-items:baseline;gap:6px;white-space:nowrap}
.pprice .old-price{order:-1;font-size:12px}
.prow{align-items:baseline;flex-wrap:nowrap}

.ptags .disc-badge{font-size:11px;padding:3px 8px;border-radius:8px;line-height:1.3}

@media(hover:hover) and (pointer:fine){.hs{scroll-snap-type:none}}
.hs{scroll-behavior:auto}

/* запрет выделения текста мышью (поля ввода не затронуты) */
html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
img{-webkit-user-drag:none;user-drag:none}

/* ── v10: дизайн админки, рассылка, реф-блок ── */
.seg{grid-template-columns:repeat(3,1fr);gap:6px;padding:6px}
.seg button{height:42px;font-size:13px;white-space:nowrap}
.seg button.on{box-shadow:0 2px 10px rgba(91,163,217,.35)}
.a-head h2,.card>h3{letter-spacing:-.01em}
.bc-count{font-size:12px;color:var(--sub);text-align:right;margin-top:-6px}

.tgl-row{display:flex;align-items:center;justify-content:space-between;gap:16px}

.tgl i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.4);transition:transform .2s}
.tgl.on{background:var(--ac);border-color:transparent}
.tgl.on i{transform:translateX(20px)}
.tgm{background:#17212b;border:1px solid var(--brd);border-radius:14px;overflow:hidden;max-width:360px;margin:0 auto;width:100%}
.tgm-img{width:100%;display:block;max-height:190px;object-fit:cover}
.tgm-t{padding:10px 12px 12px;font-size:14px;line-height:1.45;color:#e8eef5;word-break:break-word}
.tgm-btn{margin:0 8px 8px;background:rgba(91,163,217,.18);color:#7fb8e6;text-align:center;padding:10px;border-radius:9px;font-weight:700;font-size:14px}
.bc-act{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bc-act .btn:disabled{opacity:.45}
.ref .cred{justify-content:center}
.ref .cred code{font-size:13px;text-align:center}
.ref-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ref-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ref-stats>div{background:var(--sf2);border-radius:12px;padding:10px;text-align:center}
.ref-stats b{display:block;font-size:18px;font-weight:800}
.ref-stats span{font-size:12px;color:var(--sub);font-weight:600}

.cred code.mask{white-space:nowrap;word-break:normal;letter-spacing:1px}
.pe-acc{display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--brd);border-radius:14px;background:var(--sf2)}
.pe-acc h3{font-size:15px}
.pe-acc .pf-label input{background:var(--sf)}
.pe-acc code{font:700 14px ui-monospace,Menlo,monospace;word-break:break-all}

/* ── v11: админка ── */
.atabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 6px;cursor:grab;-webkit-overflow-scrolling:touch;user-select:none}
.atabs::-webkit-scrollbar{display:none}
.atab{flex:0 0 auto;display:flex;align-items:center;gap:7px;height:40px;padding:0 14px;border-radius:12px;background:var(--sf);border:1px solid var(--brd);color:var(--sub);font-weight:700;font-size:13px;white-space:nowrap;transition:background .15s,color .15s}
.atab svg{flex-shrink:0}

.a-title{display:flex;align-items:center;gap:12px;margin-top:2px}
.a-ti{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(91,163,217,.26),rgba(91,163,217,.08));color:var(--ac);flex-shrink:0}
.a-tt{flex:1;min-width:0}.a-tt h2{line-height:1.15}
.card-h{align-items:center}
.ch-l{display:flex;align-items:center;gap:9px;min-width:0}
.ch-i{width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--sf2);color:var(--ac);flex-shrink:0}
.card-h h3{font-size:15px}
.kpi-h{display:flex;align-items:center;gap:8px}
.kpi-i{width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);flex-shrink:0}
.kpi-h small{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi-s{font-size:12px;color:var(--sub)}
.av{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px;flex-shrink:0}
.e-ic{width:58px;height:58px;border-radius:18px;background:var(--sf2);color:var(--sub);display:flex;align-items:center;justify-content:center}
.sk{background:linear-gradient(90deg,var(--sf) 25%,var(--sf2) 50%,var(--sf) 75%);background-size:200% 100%;animation:shim 1.3s linear infinite;border-radius:16px;border:1px solid var(--brd)}
.kpis>.sk{height:92px}
@keyframes shim{to{background-position:-200% 0}}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrow.w3{grid-template-columns:40px 1fr auto;gap:12px}
.crow.av3{grid-template-columns:40px 1fr auto;gap:12px}
.tk2{flex-direction:row;gap:12px;align-items:flex-start}
.tk-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.prow2{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--brd)}
.pdot{width:12px;height:12px;border-radius:4px;margin-top:5px;flex-shrink:0}
.pr-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.slotbar{height:6px;border-radius:4px;background:var(--sf2);overflow:hidden}
.slotbar i{display:block;height:100%;background:var(--ok);border-radius:4px}
.promo-r .slotbar i{background:var(--ac)}
.btn.sm svg{margin-right:4px;vertical-align:-2px}

/* focus */
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button:focus-visible{outline:2px solid var(--ac)}

/* ── Профиль (mp-*) ── */
.mp-hero{position:relative;overflow:hidden;border-radius:20px;padding:18px 16px 16px;display:flex;flex-direction:column;gap:16px;color:#fff;background:radial-gradient(120% 140% at 100% 0%,#2f6fa6 0%,transparent 55%),linear-gradient(145deg,#1e3a5f,#12263d);border:1px solid rgba(91,163,217,.28)}
.mp-user{display:flex;align-items:center;gap:12px;min-width:0}
.mp-av{width:52px;height:52px;font-size:21px;box-shadow:0 0 0 3px rgba(255,255,255,.14)}
.mp-who{min-width:0;flex:1}
.mp-name{font-size:17px;font-weight:800;line-height:1.2;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mp-sub{font-size:13px;color:rgba(255,255,255,.66);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mp-bal{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px;border-top:1px solid rgba(255,255,255,.14)}
.mp-lbl{font-size:12px;font-weight:600;color:rgba(255,255,255,.66);text-transform:uppercase;letter-spacing:.06em}
.mp-sum{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-top:2px;color:#fff}
.mp-top{width:auto;height:42px;padding:0 18px;font-size:14px;flex:none}
.mp-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mp-stats>div{background:var(--sf);border:1px solid var(--brd);border-radius:16px;padding:14px 8px 12px;text-align:center;min-width:0;display:flex;flex-direction:column;gap:3px}
.mp-stats b{font-size:18px;font-weight:800;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-stats span{font-size:12px;color:var(--sub);font-weight:600}
.mp-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mp-card>.mp-h h3,.card.ref>h3,.card .row>h3{font-size:16px;font-weight:800;letter-spacing:-.01em}
.mp-faq details{border-top:1px solid var(--brd);padding:0}
.mp-faq summary{padding:13px 0;font-size:14px;font-weight:600}
.mp-faq summary::after{font-size:18px;color:var(--sub)}
.mp-faq details p{margin:0 0 14px;line-height:1.5}
.mp-sup{display:grid;grid-template-columns:1.3fr 1fr;gap:10px;margin-top:4px}
.mp-sup .btn{height:46px;font-size:14px}

.hd-r{display:flex;align-items:center;gap:8px}
.tgch{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#2aabee;color:#fff;border:0;cursor:pointer;flex:none;transition:transform .15s,opacity .15s}
.tgch:active{transform:scale(.94);opacity:.9}

/* ── Hero v2 ── */
.hv2{padding:20px 18px 18px;border:1px solid rgba(91,163,217,.22);background:radial-gradient(120% 120% at 100% 0%,rgba(64,144,200,.42) 0%,transparent 58%),linear-gradient(150deg,#1b3a63 0%,#0e1d36 62%,#0f1726 100%)}
.hv-eyebrow{position:relative;display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:#bcd6ee;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:5px 11px 5px 9px;margin-bottom:12px}
.hv-eyebrow i{width:7px;height:7px;border-radius:50%;background:#5cb87a;box-shadow:0 0 0 3px rgba(92,184,122,.25)}
.hv2 h2{font-size:24px;line-height:1.18;letter-spacing:-.02em;font-weight:800}
.hv2 h2 em{font-style:normal;background:linear-gradient(90deg,#7fc4f2,#5ba3d9);-webkit-background-clip:text;background-clip:text;color:transparent}
.hv2 p{margin-top:8px;line-height:1.45}
.hv-stats{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.hv-stats>div{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:13px;padding:10px 6px;text-align:center;min-width:0}
.hv-stats b{display:block;font-size:18px;font-weight:800;color:#fff;line-height:1.15;white-space:nowrap}
.hv-stats span{font-size:11.5px;color:rgba(255,255,255,.62);font-weight:600}
.hv-actions{position:relative;display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:14px}
.hv-actions .btn{height:46px;font-size:15px}
.hv-rnd{height:46px;padding:0 16px;border-radius:12px;display:inline-flex;align-items:center;gap:7px;font:inherit;font-size:14px;font-weight:700;color:#e4eefa;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);cursor:pointer;transition:background .15s}
.hv-rnd:hover{background:rgba(255,255,255,.14)}
.hv-rnd:active{transform:scale(.97)}

/* ── checkout & topup visual fixes ── */

/* pay-methods: два варианта оплаты стопкой с gap */
.pay-methods{display:flex;flex-direction:column;gap:8px}

/* сумма — строки со скидками чуть меньше, итог крупный */
.sum{padding:1px 0;align-items:baseline}
.sum .mut{font-size:13px}
.sum.total{padding-top:6px;margin-top:2px}

/* зачёркнутая цена в строке «Цена» */
.sum .price-line{display:inline-flex;align-items:baseline;gap:0}
.sum .price-line s{font-size:13px;font-weight:400;color:var(--sub);text-decoration:line-through}

/* stars-info в topup — единый стиль с opt */
.stars-info{
  background:var(--sf2);border:1px solid var(--brd);
  border-radius:13px;padding:14px;
  font-weight:700;font-size:14px;text-align:center;
  line-height:1.45;
}
.stars-info .mut{font-size:13px;font-weight:500;margin-top:3px;display:block}

/* гарантийный текст */
.checkout-guarantee{
  font-size:12px;line-height:1.5;color:var(--sub);
  padding:8px 12px;background:var(--sf2);border-radius:10px;
}

/* кнопка оплаты — фиксируем ширину чтобы не прыгала при смене текста */
.co-pay-btn{min-width:0;width:100%;white-space:nowrap;overflow:hidden}
#go{min-width:0;width:100%;white-space:nowrap}

// STEAM_DATA[игра] = { avg: средняя цена, ₽; sale: цена со скидкой СЕЙЧАС, ₽ (или null); pct: скидка, %; est: true = ориентировочная оценка }
// Правило экономии: если у игры сейчас есть скидка, берём цену со скидкой (sale), иначе среднюю цену (avg).
// Реальные значения подгружает бэкенд (GET /api/steam-prices, см. steam/steam_prices.py). Пока бэкенда нет, avg это оценка.
const STEAM_DATA = Object.fromEntries(Object.entries(STEAM_PRICE).map(([g,v]) => [g,{avg:v,sale:null,pct:0,est:true}]));
STEAM_DATA["Hollow Knight: Silksong"] = {avg:599,sale:null,pct:0,est:true};
const steamNow = g => { const d = STEAM_DATA[g]; return d ? (d.sale != null ? d.sale : d.avg) : 0; };
async function loadSteamPrices() {
  try {
    const res = await fetch("/api/steam-prices", {cache:"no-store"});
    if(!res.ok) return;
    const j = await res.json();
    for(const [g,v] of Object.entries(j)) STEAM_DATA[g] = Object.assign({}, STEAM_DATA[g], v, {est:false});
    render();
  } catch(e) {}
}

const RU="йцукенгшщзхъфывапролджэячсмитьбю";
const TR={а:"a",б:"b",в:"v",г:"g",д:"d",е:"e",ж:"zh",з:"z",и:"i",й:"y",к:"k",л:"l",м:"m",н:"n",о:"o",п:"p",р:"r",с:"s",т:"t",у:"u",ф:"f",х:"h",ц:"c",ч:"ch",ш:"sh",щ:"sh",ы:"y",э:"e",ю:"yu",я:"ya",ь:"",ъ:""};

function norm(s){return s.toLowerCase().replace(/ё/g,"е").replace(/[''`™®]/g," ").replace(/[^a-zа-я0-9]+/g," ").trim()}
function cands(g){
  let c=AL.get(g);if(c)return c;
  const n=norm(g);c=[n];
  ALI.forEach(([k,a])=>{if(n.includes(k))a.split("|").forEach(x=>c.push(norm(x)))});
  AL.set(g,c);return c;
}
function lev(a,b){const m=a.length,n=b.length;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function variants(raw){
  const q=raw.toLowerCase(),v=[q];
  if(/[a-z]/.test(q)&&!/[а-я]/.test(q))v.push([...q].map(c=>{const i=EN.indexOf(c);return i<0?c:RU[i]}).join(""));
  if(/[а-я]/.test(q)&&!/[a-z]/.test(q)){v.push([...q].map(c=>{const i=RU.indexOf(c);return i<0?c:EN[i]}).join(""));v.push([...q.replace(/ё/g,"е")].map(c=>TR[c]??c).join(""))}
  return [...new Set(v.map(norm).filter(x=>x.length))];
}
function tokM(qt,ct){if(ct.startsWith(qt))return 1;if(qt.length<3)return 0;const d=qt.length<=4?1:2;return Math.min(lev(qt,ct),lev(qt,ct.slice(0,qt.length)))<=d?.7:0}
function sc1(c,q){
  if(c.includes(q))return c.startsWith(q)?4:3;
  const cs=c.replace(/ /g,""),qs=q.replace(/ /g,"");
  if(qs.length>=3&&cs.includes(qs))return 2.8;
  if(q.length<2)return 0;
  let qt=q.split(" ");if(qt.length>1)qt=qt.filter(t=>t!=="the"&&t!=="of");
  const ct=c.split(" ");let s=0;
  for(const t of qt){let b=0;for(const x of ct)b=Math.max(b,tokM(t,x));if(!b)return 0;s+=b}
  return 1+s/qt.length;
}
function scoreG(g,vs){let b=0;for(const c of cands(g))for(const q of vs)b=Math.max(b,sc1(c,q));return b}
function rank(list,q){const vs=variants(q);if(!vs.length)return list.slice();return list.map(g=>[g,scoreG(g,vs)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).map(x=>x[0])}
function rankS(list,q){const vs=variants(q);return list.map(g=>[g,scoreG(g,vs)]).filter(x=>x[1]>0)}

  if(!c) return {err:PROMO_ERR.empty};
  try{
    const j = await api("/api/x?r=promo",{method:"POST",body:{action:"check",code:c}});
    if(j.kind === "bal"){
      const k = await api("/api/x?r=promo",{method:"POST",body:{action:"redeem",code:c}});
      S.bal = k.balance; chrome(); return {bal:k.added};
    }
    S.promo = j.code; S.promoInfo = j; return {pct:j.value};
  }catch(e){ return {err: PROMO_ERR[e.message] || "Не удалось проверить промокод"}; }
}

const hap = () => { try{window.Telegram?.WebApp?.HapticFeedback?.impactOccurred("light")}catch(e){} };
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const r = n => Math.round(n).toLocaleString("ru") + " ₽";
const esc = x => String(x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tm = ts => new Date(ts).toLocaleString("ru",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
const hue = s => {let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
const bg = n => `linear-gradient(155deg,hsl(${hue(n)} 45% 30%),hsl(${hue(n)} 50% 14%))`;
const CDN = "https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/";
const steamImg = id => id ? `https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/${id}/header.jpg` : null;
const coverBg = (c,g) => APP[g] ? `background:${c};background-image:url(${steamImg(APP[g])});background-size:cover;background-position:center` : `background:${c}`;
const priceOf = p => Math.max(1, Math.round(p.price.buy * (1-(p.disc||0)/100)));
const short = n => { n=n.split(/[:—]/)[0].trim(); return n.length>20?n.slice(0,19)+"…":n };

function calcSavings(p) {
  let total = 0;
  p.games.forEach(g => { total += steamNow(g); });
  return total;
}
function savingsStats(p) {
  let sale = 0, est = false, priced = 0;
  p.games.forEach(g => { const d = STEAM_DATA[g]; if(!d || !steamNow(g)) return; priced++; if(d.sale != null) sale++; if(d.est) est = true; });
  return {sale, est, priced};
}
function steamRow(g, pp) {
  const d = STEAM_DATA[g], now = steamNow(g);
  if(!d || !now) return '';
  const saved = now - pp, onSale = d.sale != null, ap = d.est ? "≈" : "";
  const label = onSale ? `Сейчас в Steam${d.pct ? ` · −${d.pct}%` : ''}` : 'Средняя цена в Steam';
  return `<div style="display:flex;align-items:center;gap:10px;background:rgba(92,184,122,.1);border:1px solid rgba(92,184,122,.25);border-radius:12px;padding:10px 14px"><div style="flex:1"><div style="font-size:12px;color:var(--sub);margin-bottom:2px">${label}</div><div style="font-size:20px;font-weight:800;text-decoration:line-through;color:var(--sub)">${ap}${r(now)}</div>${onSale && d.avg > now ? `<div style="font-size:12px;color:var(--sub)">обычно ${ap}${r(d.avg)}</div>` : ''}</div>${saved>0?`<div style="text-align:right"><div style="font-size:12px;color:var(--sub);margin-bottom:2px">Экономия</div><div style="font-size:18px;font-weight:800;color:var(--ok)">−${r(saved)}</div></div>`:''}</div>`;
}

const toast = t => {
  const e = $("#toast"); e.textContent = t; e.classList.add("on");
  clearTimeout(e._t); e._t = setTimeout(()=>e.classList.remove("on"), 2500);
};
const sheet = h => { const sb=$("#sb"); sb.innerHTML = '<div class="sheet-handle"></div>' + h; sb.classList.remove("co-sheet"); $("#sheet").classList.add("open"); };
const closeSheet = () => { $("#sheet").classList.remove("open"); $("#sb").classList.remove("co-sheet"); };

const unreadU = () => S.tickets.filter(t=>t.uu).length;
const getT = () => (S.tab==="atk" ? S.atickets : S.tickets).find(t=>t.id===S.tk);
const mapT = t => ({id:t.id, subj:t.subject, st:t.status, ts:+new Date(t.created_at), uu:t.unread_user, ua:t.unread_admin,
  who: t.username ? "@"+t.username : (t.first_name || ("id"+t.user_id)),
  msgs:t.msgs.map(m=>({f:m.from_admin?"sup":"me", t:m.body, ts:+new Date(m.created_at)}))});
const tSig = L => L.map(t=>t.id+":"+t.st+":"+t.msgs.length+":"+(t.uu?1:0)+(t.ua?1:0)).join("|");
async function loadTickets(adm){
  if(!tgInit()) return false;
  try{
    const L = (await api(adm ? "/api/x?r=tickets&all=1" : "/api/x?r=tickets")).map(mapT);
    const key = adm ? "atickets" : "tickets", ch = tSig(L) !== tSig(S[key]);
    S[key] = L; if(adm) S.atLoaded = true; return ch;
  }catch(e){ return false; }
}
async function pollTickets(){
  const a = await loadTickets(false), b = isAdmin() ? await loadTickets(true) : false;
  if(!a && !b) return;
  chrome();
  const typing = $("#tm") && $("#tm").value.trim();
  if(["mine","me","tickets","atks"].includes(S.tab) || (["ticket","atk"].includes(S.tab) && !typing)){ const y = scrollY; render(); if(!["ticket","atk"].includes(S.tab)) scrollTo(0,y); }
}
async function createTicket(subj, text){
  if(!tgInit()){ toast("Откройте приложение в Telegram"); return null; }
  try{ const j = await api("/api/x?r=tickets",{method:"POST",body:{action:"create",subject:subj,body:text}}); await loadTickets(false); return j.id; }
  catch(e){ toast(e.message==="no_schema" ? errMsg(e) : e.message==="limit" ? "Слишком много обращений за сутки — дождитесь ответа" : "Не удалось отправить обращение ("+e.message+detailOf(e)+")"); return null; }
}

function chrome() {
  const bal = $("#balchip");
  if(bal) bal.textContent = r(S.bal);
  $$("#nav button").forEach(b => b.classList.toggle("on", b.dataset.t===({admin:"me",atks:"me",atk:"me",favs:"me",tickets:"mine",ticket:"mine"}[S.tab]||S.tab)));
  const nb = document.querySelector("#nav button[data-t=mine]"), un = unreadU();
  if(un) nb.dataset.n = un; else delete nb.dataset.n;
}

function savingsBlock(p) {
  const total = calcSavings(p), pp = priceOf(p), saved = total - pp;
  if(saved <= 0 || total < pp * 2) return "";
  const st = savingsStats(p), ap = st.est ? "≈" : "";
  const note = st.sale
    ? `${st.sale} из ${st.priced} игр сейчас со скидкой, по ним взята цена со скидкой. Для остальных, средняя цена в Steam.`
    : `Для игр без скидки взята средняя цена в Steam.`;
  return `<div class="savings" style="flex-wrap:wrap">
    <div style="flex:1">
      <div style="font-size:13px;color:var(--sub)">Все игры в Steam стоят</div>
      <div class="big">${ap}${r(total)}</div>
    </div>
    <div style="font-size:13px;color:var(--sub);text-align:right">у нас ${r(pp)}<br><b style="color:var(--ok)">экономия ${ap}${r(saved)}</b></div>
    <div style="flex-basis:100%;font-size:12px;color:var(--sub);line-height:1.4">${note}${st.est ? " Цены ориентировочные." : ""}</div>
  </div>`;
}

function packTopGames(p) {
  // Priority: showGames from DB → TOP hardcode → first games
  const sg = Array.isArray(p.showGames) && p.showGames.length ? p.showGames : null;
  return sg || TOP[p.id] || p.games.slice(0, 3);
}
function packCoverGame(p) {
  if(p.coverGame) return p.coverGame;
  return packTopGames(p)[0] || p.games[0] || "";
}
function packHead(p) {
  const tops = packTopGames(p);
  return `<div class="pack-hero" style="background:${p.c}">
    ${p.disc?`<span class="hero-badge">Скидка −${p.disc}%</span>`:""}
    <div class="t"><b>${p.count}</b><span>игр в наборе</span></div>
    <div class="stk">${tops.map(n=>`<div class="th" style="background:${bg(n)}">${APP[n]?`<img src="${steamImg(APP[n])}" alt="" onerror="this.src=this.src.replace('shared.akamai.steamstatic.com/store_item_assets','cdn.cloudflare.steamstatic.com/steam/apps');this.onerror=null">`:esc(n[0])}</div>`).join("")}</div>
  </div>`;
}

function packRow(p) {
  const cg = packCoverGame(p), a = APP[cg], warn = p.stock <= 2;
  return `<button class="pack" data-act="open" data-id="${p.id}" aria-label="${esc(p.name)}">
    <div class="cover" style="background:${bg(cg)}">${a?`<img src="${steamImg(a)}" alt="" onerror="this.src=this.src.replace('shared.akamai.steamstatic.com/store_item_assets','cdn.cloudflare.steamstatic.com/steam/apps');this.onerror=null">`:`<span class="cl">${esc(cg[0])}</span>`}</div>

      </div>
      <div class="sub">${p.sub}</div>
      <div class="ptags">
        ${p.disc?`<span class="disc-badge">−${p.disc}%</span>`:""}

function shop() {
  if(S.open) return detail(PACKS.find(x=>x.id===S.open));
  const V = $("#view");
  V.innerHTML = `<div class="search-wrap">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input class="search" id="gs" type="search" placeholder="Поиск по названию (рус / eng)" value="${esc(S.q)}" autocomplete="off">
  </div>
  <div id="gr"></div>
  <div id="home">${home()}</div>`;
  const g = $("#gs");
  let debounce;
  g.oninput = () => { clearTimeout(debounce); debounce = setTimeout(()=>{ S.q=g.value.trim(); gres(); }, 120); };
  gres();

function gres() {
  const q = S.q, el = $("#gr"), h = $("#home");
  if(h) h.style.display = q ? "none" : "";
  if(!q) { el.innerHTML = ""; return; }
  if(q.length < 2) { el.innerHTML = `<div class="mut" style="padding:8px 4px">Введите хотя бы 2 символа</div>`; return; }
  const m = [];
  PACKS.forEach(p => rankS(p.games, q).forEach(([n,sc]) => {
    const ex = m.find(x=>x[0]===n);
    if(ex) ex[1].push(p); else m.push([n, [p], sc]);
  }));
  m.sort((a,b)=>b[2]-a[2]||a[0].localeCompare(b[0]));
  if(!m.length) {
    el.innerHTML = `<div class="card"><h3>Такой игры пока нет</h3><div class="mut">Нажмите кнопку — мы запишем запрос и добавим игру, если будет спрос.</div><button class="btn sec" style="margin-top:4px" data-act="want">Хочу эту игру</button></div>`;
    return;
  }
  el.innerHTML = `<div class="results">${m.slice(0,40).map(([n,ps]) => `<div class="result-item">
    <button class="gname-btn" data-act="ginfo" data-g="${encodeURIComponent(n)}" data-pid="${ps[0].id}">${n}</button>
    <span class="pack-refs">${ps.map(p=>`<span class="pack-ref" data-act="open" data-id="${p.id}"><span class="pack-dot" style="background:${p.c}"></span>${p.name.split(" ")[0]}${p.disc?` <span class="disc-badge">−${p.disc}%</span>`:""}</span>`).join("")}</span>
  </div>`).join("")}</div>`;
}

      <div class="row">
        <span class="mut">Свободных слотов: ${p.stock} из ${p.slots}</span>
        <span class="tag ok">Навсегда</span>
      </div>

      ${savingsBlock(p)}
      ${p.stock === 0 ? `<button class="btn sec" disabled>Нет свободных слотов</button>` : `<button class="btn pri" data-act="buy" data-id="${p.id}">Купить за ${r(priceOf(p))}${p.disc?` <s class="btn-old">${r(p.price.buy)}</s>`:""}</button>`}

    </div>
  </div>
  <div class="card">
    <div class="row"><h3>Игры в наборе</h3><span class="mut" id="cnt"></span></div>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input class="search" id="q" type="search" placeholder="Найти в наборе…" autocomplete="off">
    </div>
    <div class="glist" id="gl"></div>
  </div>`;
  const draw = q => {
    const m = q.trim() ? rank(p.games, q) : p.games;
    $("#cnt").textContent = q ? `${m.length} из ${p.games.length}` : `${p.games.length} игр`;
    $("#gl").innerHTML = m.map(g=>`<div class="glist-item">
      ${APP[g]?`<img src="https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/${APP[g]}/header.jpg" alt="" loading="lazy" style="width:44px;height:20px;object-fit:cover;border-radius:4px;flex-shrink:0">`:``}
      <button class="gname-btn" data-act="ginfo" data-g="${encodeURIComponent(g)}" data-pid="${p.id}">${esc(g)}</button>
      <button class="fav ${S.fav.has(g)?'on':''}" data-act="fav" data-g="${encodeURIComponent(g)}" aria-label="В избранное">${S.fav.has(g)?'♥':'♡'}</button>
    </div>`).join("") || `<div class="glist-item mut">Не найдено</div>`;
  };
  draw(""); $("#q").oninput = e => draw(e.target.value);
}

function copyText(text, msg) {
  const done = () => toast(msg);
  const old = () => { try { const el = document.createElement("textarea"); el.value = text; el.style.cssText = "position:fixed;opacity:0"; document.body.appendChild(el); el.select(); document.execCommand("copy"); el.remove(); done(); } catch(e) { toast("Не удалось скопировать"); } };
  if(navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(done).catch(old); else old();
}

// Загрузка фото через /api/upload (base64 → Telegram → URL)
async function uploadPhoto(file) {
  return new Promise((resolve, reject) => {
    if (!file || !file.type.startsWith("image/")) { reject(new Error("not_image")); return; }
    if (file.size > 10 * 1024 * 1024) { reject(new Error("too_large")); return; }
    const r = new FileReader();
    r.onload = async () => {
      try {
        const data = r.result.split(",")[1];
        const j = await api("/api/upload", { method: "POST", body: { data, mime: file.type } });
        if (j.ok && j.url) resolve(j.url);
        else reject(new Error(j.error || "upload_failed"));
      } catch(e) { reject(e); }
    };
    r.onerror = () => reject(new Error("read_failed"));
    r.readAsDataURL(file);
  });
}

function initPhotoPicker(inputId, onUrl) {
  const inp = $(\`#\${inputId}\`);
  if (inp) inp.oninput = e => { onUrl(e.target.value); updatePhotoPreview(inputId, e.target.value); };
  const fileInp = document.querySelector(\`.ph-file-inp[data-for="\${inputId}"]\`);
  if (fileInp) fileInp.onchange = async e => {
    const file = e.target.files?.[0]; if (!file) return;
    const prev = $(\`#\${inputId}-prev\`);
    if (prev) { prev.style.display = ""; $(\`#\${inputId}-img\`).src = URL.createObjectURL(file); }
    toast("Загружаем фото…");
    try {
      const url = await uploadPhoto(file);
      if (inp) inp.value = url;
      onUrl(url);
      updatePhotoPreview(inputId, url);
      toast("Фото загружено ✓");
    } catch(e) {
      const msgs = { not_image:"Не картинка", too_large:"Файл > 10 МБ", forbidden:"Только для админов" };
      toast(msgs[e.message] || "Ошибка загрузки");
      if (prev) prev.style.display = "none";
    }
    fileInp.value = "";
  };
  // init preview if value already set
  if (inp?.value) updatePhotoPreview(inputId, inp.value);
}
function updatePhotoPreview(inputId, url) {
  const prev = $(\`#\${inputId}-prev\`), img = $(\`#\${inputId}-img\`);
  if (!prev || !img) return;
  if (url && /^https:\/\/\S+/.test(url)) { img.src = url; prev.style.display = ""; }
  else prev.style.display = "none";
}

// Живой таймер для отображения оставшегося времени доступа к данным
function fmtCredTimer(msLeft) {
  if (msLeft <= 0) return "0 дн.";
  const totalSec = Math.floor(msLeft / 1000);
  const d = Math.floor(totalSec / 86400);
  const h = Math.floor((totalSec % 86400) / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  if (d > 1) return `${d} дн. ${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  if (d === 1) return `1 дн. ${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  if (h > 0)  return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}
let _credTimerInterval = null;
function startCredTimers() {
  if (_credTimerInterval) clearInterval(_credTimerInterval);
  function tick() {
    const timers = document.querySelectorAll(".cred-timer[data-until]");
    if (!timers.length) { clearInterval(_credTimerInterval); _credTimerInterval = null; return; }
    timers.forEach(el => {
      const until = +el.dataset.until;
      const left = until - Date.now();
      el.textContent = left > 0 ? fmtCredTimer(left) : "0 дн.";
      // Подсвечиваем красным если меньше суток
      if (left > 0 && left < 86400000) el.style.color = "var(--hot)";
      else if (left > 0 && left < 259200000) el.style.color = "var(--warn, #f59e0b)"; // < 3 дней
      else el.style.color = "var(--ink)";
    });
  }
  tick();
  _credTimerInterval = setInterval(tick, 1000);
}

function bcSend() {
  if(BC.run?.state === "run") return;
  const body = bcBody(); if(!body) return;
  const msg = `Отправить сообщение ${BC.total != null ? BC.total + " пользователям" : "всем пользователям"}? Отменить отправку после запуска нельзя.`;
  const go = () => bcRunLoop(false, body);
  const w = window.Telegram?.WebApp;
  if(w?.showConfirm) w.showConfirm(msg, ok => { if(ok) go(); }); else if(confirm(msg)) go();
}
async function bcRunLoop(resume, body) {
  let st = BC.run;
  if(!resume || !st) st = BC.run = { body, after:0, sent:0, failed:0, blocked:0, err:null, stop:false, state:"run" };
  st.stop = false; st.state = "run"; st.error = null; bcPaint();
  try {
    for(;;) {
      const j = await api("/api/broadcast", {method:"POST", body:{action:"batch", ...st.body, after:st.after}});
      st.sent += j.sent; st.failed += j.failed; st.blocked += j.blocked; st.err = st.err || j.err; st.after = j.last;
      if(j.done) { st.state = "done"; break; }
      if(st.stop) { st.state = "paused"; break; }
      bcPaint();
      await new Promise(r => setTimeout(r, 1100));
    }
  } catch(e) { st.state = "paused"; st.error = BC_ERR[e.message] || "Нет связи с сервером"; }
  bcPaint(); if(st.state === "done") bcLoadCount();
}
function bcPaint() {
  const el = $("#bc-run"), st = BC.run; if(!el) return;
  if(!st) { el.innerHTML = ""; return; }
  const total = BC.total || 0, doneN = st.sent + st.failed;
  const pct = st.state === "done" ? 100 : Math.min(99, total ? Math.round(doneN / total * 100) : 0);
  el.innerHTML = `<div class="card">
    <div class="row"><h3>${st.state === "done" ? "Рассылка завершена ✅" : st.state === "run" ? "Отправляем…" : "Приостановлено"}</h3><span class="mut">${st.sent}${total ? " из " + total : ""}</span></div>
    <div class="hb-bar"><i style="width:${pct}%"></i></div>
    <div class="mut" style="font-size:12px;line-height:1.5">Доставлено: ${st.sent} · не доставлено: ${st.failed}${st.blocked ? ` (заблокировали бота: ${st.blocked})` : ""}${st.err ? `<br>Telegram: ${esc(st.err)}` : ""}${st.error ? `<br>${esc(st.error)}` : ""}</div>
    ${st.state === "run" ? `<button class="btn sec sm" data-act="bcstop">Остановить</button>` : ""}
    ${st.state === "paused" ? `<button class="btn pri sm" data-act="bcresume">Продолжить с места остановки</button>` : ""}
  </div>`;
}

const nf = n => Math.round(n).toLocaleString("ru");

const fmtDay = d => d.toLocaleDateString("ru", {day:"numeric", month:"short"});
const niceMax = v => { if(v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))), n = v/p; return ([1,1.5,2,3,4,5,6,8,10].find(s=>s>=n)) * p; };
const sumBy = (a,f) => a.reduce((s,x)=>s+f(x), 0);
const dlt = (a,b) => { if(!b) return ""; const p = (a-b)/b*100, c = Math.abs(p)<.5 ? "fl" : p>0 ? "up" : "dn"; return `<span class="dl ${c}">${p>0.5?"▲":p<-0.5?"▼":"•"} ${Math.abs(p).toFixed(0)}%</span> <span class="mut" style="font-size:11px">к пред. периоду</span>`; };

// ── Графики (SVG без библиотек) ──
const CH = {};
function chartFrame(id, pts, fmt, kind){
  const W=340, H=176, L=34, R=6, T=8, B=22, iw=W-L-R, ih=H-T-B, n=pts.length;
  const max = niceMax(Math.max(...pts.map(p=>p.v)));
  const x = kind==="bar" ? (i => L + (i+.5)*iw/n) : (i => L + (n>1 ? i*iw/(n-1) : iw/2));
  const y = v => T + ih - (v/max)*ih;
  CH[id] = {pts, fmt, W, x:pts.map((_,i)=>x(i)), y:pts.map(p=>y(p.v))};
  let grid = "";
  for(let k=0;k<=4;k++){ const v = max*k/4, yy = y(v).toFixed(1); grid += `<line class="gline" x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/><text x="${L-5}" y="${(+yy+3).toFixed(1)}" text-anchor="end">${cmp(v)}</text>`; }
  const mid = Math.floor((n-1)/2);
  const xl = [[0,"start"],[mid,"middle"],[n-1,"end"]].filter((a,i,arr)=>n>2||i!==1).map(([i,a])=>`<text x="${x(i).toFixed(1)}" y="${H-6}" text-anchor="${n===1?"middle":a}">${pts[i].l}</text>`).join("");
  return {W,H,L,R,T,B,iw,ih,n,x,y,grid,xl};
}
function chartWrap(id, f, body){
  return `<div class="ch" data-ch="${id}"><div class="ch-tip">&nbsp;</div>
  <svg viewBox="0 0 ${f.W} ${f.H}" role="img">${f.grid}${body}${f.xl}
    <line class="mk" y1="${f.T}" y2="${f.T+f.ih}" style="display:none"/><circle class="mk-dot" r="4" style="display:none"/>
  </svg></div>`;
}
function areaChart(id, pts, fmt){
  const f = chartFrame(id, pts, fmt, "area");
  const line = pts.map((p,i)=>`${i?"L":"M"}${f.x(i).toFixed(1)} ${f.y(p.v).toFixed(1)}`).join("");
  const area = `${line}L${f.x(f.n-1).toFixed(1)} ${f.T+f.ih}L${f.x(0).toFixed(1)} ${f.T+f.ih}Z`;
  return chartWrap(id, f, `<defs><linearGradient id="g-${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--ac);stop-opacity:.35"/><stop offset="1" style="stop-color:var(--ac);stop-opacity:0"/></linearGradient></defs>
    <path d="${area}" fill="url(#g-${id})"/><path d="${line}" fill="none" style="stroke:var(--ac)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`);
}
function barChart(id, pts, fmt){
  const f = chartFrame(id, pts, fmt, "bar"), bw = Math.max(2, f.iw/f.n*0.66);
  const bars = pts.map((p,i)=>{ const h = Math.max(1, f.T+f.ih-f.y(p.v)); return `<rect x="${(f.x(i)-bw/2).toFixed(1)}" y="${(f.T+f.ih-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2" style="fill:var(--ok)"/>`; }).join("");
  return chartWrap(id, f, bars);
}
function chartShow(w, c, i){
  const mk = w.querySelector(".mk"), dot = w.querySelector(".mk-dot"), tip = w.querySelector(".ch-tip");
  mk.setAttribute("x1", c.x[i]); mk.setAttribute("x2", c.x[i]); mk.style.display = "";
  dot.setAttribute("cx", c.x[i]); dot.setAttribute("cy", c.y[i]); dot.style.display = "";
  tip.innerHTML = `<span style="color:var(--sub);font-weight:600">${c.pts[i].l}</span> · ${c.fmt(c.pts[i].v)}`;
}
function chartMove(e){
  const w = e.target.closest && e.target.closest(".ch"); if(!w) return;
  const c = CH[w.dataset.ch]; if(!c) return;
  const rc = w.querySelector("svg").getBoundingClientRect();
  const vx = (e.clientX - rc.left) / rc.width * c.W;
  let bi = 0, bd = 1e9; c.x.forEach((xx,i) => { const d = Math.abs(xx-vx); if(d < bd){ bd = d; bi = i; } });
  chartShow(w, c, bi);
}
function donut(vals, colors, center, label){
  const C = 2*Math.PI*52, tot = sumBy(vals, v=>v) || 1; let off = 0;
  const segs = vals.map((v,i) => { const len = v/tot*C; const s = `<circle cx="70" cy="70" r="52" fill="none" stroke="${colors[i]}" stroke-width="18" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 70 70)"/>`; off += len; return s; }).join("");
  return `<svg viewBox="0 0 140 140" width="140" height="140" style="flex-shrink:0"><circle cx="70" cy="70" r="52" fill="none" style="stroke:var(--sf2)" stroke-width="18"/>${segs}
    <text x="70" y="70" text-anchor="middle" class="dn-n">${center}</text><text x="70" y="88" text-anchor="middle" class="dn-l">${label}</text></svg>`;
}
function hbars(rows){
  const max = Math.max(1, ...rows.map(r=>r.v));
  return `<div class="hbs">${rows.map(r=>`<div class="hb"><div class="hb-top"><span>${r.l}</span><b>${r.t}</b></div><div class="hb-bar"><i style="width:${r.p!=null?r.p:Math.round(r.v/max*100)}%;${r.c?`background:${r.c}`:""}"></i></div></div>`).join("")}</div>`;
}

// ── Реальная покупка через сервер (в Telegram): счёт Stars -> оплата -> выдача слота -> «Мои доступы» ──
async function loadOrders() {
  if(!tgInit()) return;
  try {
    const rows = await api("/api/orders");
    const hiddenOrders = JSON.parse(sessionStorage.getItem("pv_hidden_orders")||"[]");
    const THIRTY_DAYS = 30 * 24 * 60 * 60 * 1000;
    S.orders = rows
      .filter(r => !hiddenOrders.includes(r.id))
      .map(r => {
        const aged = r.created_at && (Date.now() - new Date(r.created_at).getTime()) > THIRTY_DAYS;
        return {n:r.id, id:r.id, plan:"buy", exp:null, span:0, created_at:r.created_at, aged,
          p: Object.assign({}, PACKS.find(x => x.id === r.pack_id) || {}, {
            name:r.name,
            login: aged ? null : r.login,
            pass:  aged ? null : r.pass,
            extra_service: r.extra_service || null,
            extra_login:   aged ? null : (r.extra_login || null),
            extra_pass:    aged ? null : (r.extra_pass  || null),
          })};
      });
    S.spent = rows.reduce((a, r) => a + (+r.price_rub || 0), 0);
  } catch(e) {}
}
async function waitOrder(id) {
  for(let k = 0; k < 20; k++) {
    await loadOrders();
    if(S.orders.some(o => o.id === id)) return true;
    await new Promise(r => setTimeout(r, 1200));
  }
  return false;
}

    window.Telegram.WebApp.openInvoice(j.link, async st => {
      if(st === "paid") {

// Парсит show_games из БД: принимает "[\"A\",\"B\"]" (старый JSON) или "A,B,C" (новый формат)
function parseShowGames(raw) {
  if(!raw) return [];
  if(typeof raw !== "string") return Array.isArray(raw) ? raw : [];
  const s = raw.trim();
  if(s.startsWith("[")) {
    try { return JSON.parse(s).map(x=>String(x).trim()).filter(Boolean); } catch(e) { return []; }
  }
  return s.split(",").map(x=>x.trim()).filter(Boolean);
}

// Drag-to-scroll for horizontal lists with a mouse
// Плавная прокрутка горизонтальных списков (стрелки, колесо мыши, перетаскивание с инерцией)
function hsAnim(h, to){
  const max = Math.max(0, h.scrollWidth - h.clientWidth);
  h._to = Math.max(0, Math.min(max, to));
  if(h._raf) return;
  const step = () => {
    const d = h._to - h.scrollLeft;
    if(Math.abs(d) < 1){ h.scrollLeft = h._to; h._raf = 0; return; }
    h.scrollLeft += Math.sign(d) * Math.max(1, Math.abs(d) * 0.16);
    h._raf = requestAnimationFrame(step);
  };
  h._raf = requestAnimationFrame(step);
}
const hsStop = h => { if(h._raf){ cancelAnimationFrame(h._raf); h._raf = 0; } };
let drag = null, noClick = false;
document.addEventListener("pointerdown", e => {
  if(e.pointerType !== "mouse" || e.button !== 0) return;
  const h = e.target.closest(".hs, .atabs"); if(!h) return;
  hsStop(h);
  drag = {h, x:e.clientX, sl:h.scrollLeft, moved:false, s:[{x:e.clientX, t:performance.now()}]};
});
document.addEventListener("pointermove", e => {
  if(!drag) return;
  const dx = e.clientX - drag.x;
  if(!drag.moved && Math.abs(dx) > 5){ drag.moved = true; drag.h.classList.add("drag"); }
  if(drag.moved){
    drag.h.scrollLeft = drag.sl - dx;
    drag.s.push({x:e.clientX, t:performance.now()}); if(drag.s.length > 6) drag.s.shift();
  }
});
const endDrag = () => {
  if(!drag) return;
  const {h, moved, s} = drag; drag = null;
  if(moved){
    noClick = true; setTimeout(()=>{ noClick = false; h.classList.remove("drag"); }, 60);
    const a = s[0], b = s[s.length-1], dt = b.t - a.t;
    if(dt > 0 && performance.now() - b.t < 80){ const v = (b.x - a.x) / dt; hsAnim(h, h.scrollLeft - v*260); }
  }
};
// колесо обычной мыши листает список вбок; тачпад и конец списка — как обычно
document.addEventListener("wheel", e => {
  const h = e.target.closest && e.target.closest(".hs"); if(!h || e.ctrlKey || e.shiftKey) return;
  if(Math.abs(e.deltaX) >= Math.abs(e.deltaY)) return;
  const mouse = e.deltaMode === 1 || (Number.isInteger(e.deltaY) && Math.abs(e.deltaY) >= 50);
  if(!mouse) return;
  const max = h.scrollWidth - h.clientWidth, base = h._raf ? h._to : h.scrollLeft, dy = e.deltaMode === 1 ? e.deltaY*32 : e.deltaY;
  if((dy < 0 && base <= 0) || (dy > 0 && base >= max - 1)) return;
  e.preventDefault(); hsAnim(h, base + dy*1.2);
}, {passive:false});
document.addEventListener("pointerup", endDrag);
document.addEventListener("pointercancel", endDrag);
document.addEventListener("click", e => { if(noClick){ e.stopPropagation(); e.preventDefault(); } }, true);

// Broken images
// Broken images: try alternative Steam sources, then remove
document.addEventListener("error", e => {
  const el = e.target; if(el.tagName !== "IMG") return;
  const m = el.src.match(/\/apps\/(\d+)\//);
  if(m){
    const id = m[1];
    const alts = [`${CDN}${id}/header.jpg`, `${CDN}${id}/capsule_616x353.jpg`,
      `https://cdn.cloudflare.steamstatic.com/steam/apps/${id}/header.jpg`,
      `https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/${id}/header.jpg`];
    el._tried = el._tried || new Set();
    el._tried.add(el.src);
    const next = alts.find(u => !el._tried.has(u));
    if(next){ el._tried.add(next); el.src = next; return; }
  }
  el.remove();
}, true);
